name: stl_graphmvp_adaptivegnn_paper
kind: train

# STL paper-faithful AdapterGNN (Li et al., AAAI'24):
#   - adapter_kind="paper" → for each of GraphMVP's num_layer=5 layers
#     a pre/post AdapterGNNBlock pair (atom-level, d=emb_dim=300, r=64). Total 5+5=10 adapters.
#   - Eq.(7) A(x) = BN(W_up(ReLU(W_down(x)))), Eq.(8) parallel wiring.
#   → docs/sessions/2026-05-20_adaptergnn_paper_faithful_rewrite.md

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: null
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: graphmvp
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_kind: paper          # AAAI'24 paper-faithful (default, but stated explicitly)
      adapter_bottleneck: 64
      adapter_dropout: 0.0
      # use_edge_attr is ignored in paper mode (only meaningful inside lora_gin's internal mini-GIN)
      pool: mean
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]      # TDC fold seeds actually used (manifest trainer.seeds)
  max_epochs: 100            # as trained (run 898dfd67a49b)
  patience: 15               # as trained (run 898dfd67a49b)
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2

notes: |
  STL GraphMVP + AdapterGNN paper-faithful (Li et al., AAAI'24).
  stl_graphmvp_adaptivegnn.yaml (legacy outer-only LoRA-GIN era hyperparam
  kept: r=64, use_edge_attr=true) — only the differences from this are stated:

  Backbone:
    - graphmvp_hybrid.pth (regression variant) frozen, 5-layer GIN.
    - adapter_kind="paper": a pre/post AdapterGNNBlock pair for each GIN layer
      (atom-level, d=emb_dim=300, r=64). Total 5+5 = 10 adapters.
      each block = down → ReLU → up → BN → γ·scale (γ init=0)
      → dropout → delta (NO internal residual). The caller sums it with the frozen path.
    - parallel wiring (Eq.8): h_l = BN(MLP(MP(x_l))) + s1·A1(x_l) + s2·A2(MP(x_l)).
      Calls into the decomposed internals of the GIN layer: MP(x_l) = (1+eps)*x + propagate(...), then
      BN(MLP(MP)) is the frozen path. A1 receives x_l as input, A2 receives MP(x_l) (before mlp).
    - At γ=0 init, bit-for-bit equivalent to the frozen-only baseline (verified by smoke test).
    - trainable post-pool Linear self.proj[0] (emb_dim=300 → d_h=300) + ReLU.

  vs legacy stl_graphmvp_adaptivegnn.yaml:
    - Explicitly adapter_kind="paper" (legacy also defaults to paper, so the behavior is identical
      , but this recipe makes the intent explicit).
    - use_edge_attr removed (ignored in paper mode). edge_attr inside the frozen GIN is
      used as-is — only the adapter side is atom-only.
    - adapter_bottleneck kept at 64 (same as mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6
      ). r=64 × d=300 × 10 blocks ≈ 384K params trainable.

  STL collate:
    - graphmvp is the **primary** backbone for STL — no fusion → set embeddings=[]
      and leave ``consumes`` empty too (only used when entering as an extra_backbone like in MTL
      is consumes used).
    - collate (``prepare_stl_graphmvp_loaders``) converts SMILES → PyG Batch and
      puts it into the top-level key ``batch['graphmvp_data']``, which the graphmvp adapter
      receives. Invalid SMILES become a 1-atom placeholder + presence=False (in STL
      with a single backbone the presence mask is meaningless; forward is still safe).

  Loss / Optim:
    - single_task (loss/_base/single_task.yaml): regression=masked_mae,
      classification=bce_with_logits, task weighting is irrelevant since this is STL.
    - Only AdapterGNN paper-faithful + linear head are trained → single lr=1e-3.
    - max_epochs=100, patience=15 — compensates for weak adapter training signal. (as trained,
      run 898dfd67a49b; the legacy variant had patience 20)

  Comparison target:
    - stl_graphmvp_adaptivegnn.yaml (same paper mode default).
    - MTL paper-faithful: mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6.yaml
      (same backbone/r=64, head=grouped, loss=mixed_task_gradnorm) → for MTL ↔ STL
      fair comparison.
    - Backbone family STL: stl_chemeleon_adaptivegnn_paper.yaml (d_h=2048, depth=3,
      bond-level adapter r=128 × 4).

  ⚠ Weight download required (data/weights/graphmvp/graphmvp_hybrid.pth — if missing,
    falls back to smoke mode after a random-init warning).
