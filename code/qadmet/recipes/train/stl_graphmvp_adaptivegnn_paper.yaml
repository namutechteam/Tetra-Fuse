name: stl_graphmvp_adaptivegnn_paper
kind: train

# STL paper-faithful AdapterGNN (Li et al., AAAI'24):
#   - adapter_kind="paper" → GraphMVP num_layer=5 의 각 layer 마다
#     pre/post AdapterGNNBlock 쌍 (atom-level, d=emb_dim=300, r=64). 총 5+5=10 adapter.
#   - Eq.(7) A(x) = BN(W_up(ReLU(W_down(x)))), Eq.(8) parallel wiring.
#   → docs/sessions/2026-05-20_adaptergnn_paper_faithful_rewrite.md

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: null
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: graphmvp
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_kind: paper          # AAAI'24 paper-faithful (default 이지만 명시)
      adapter_bottleneck: 64
      adapter_dropout: 0.0
      # use_edge_attr 는 paper 모드에서 무시 (lora_gin 내부 mini-GIN 에서만 의미)
      pool: mean
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]      # TDC fold seeds actually used (manifest trainer.seeds)
  max_epochs: 100            # as trained (run 898dfd67a49b)
  patience: 15               # as trained (run 898dfd67a49b)
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2

notes: |
  STL GraphMVP + AdapterGNN paper-faithful (Li et al., AAAI'24).
  stl_graphmvp_adaptivegnn.yaml (legacy outer-only LoRA-GIN 시절 hyperparam
  유지: r=64, use_edge_attr=true) 와의 차이점만 명시:

  Backbone:
    - graphmvp_hybrid.pth (regression variant) frozen, 5-layer GIN.
    - adapter_kind="paper": 각 GIN layer 마다 pre/post AdapterGNNBlock 쌍
      (atom-level, d=emb_dim=300, r=64). 총 5+5 = 10 adapter.
      각 block = down → ReLU → up → BN → γ·scale (γ init=0)
      → dropout → delta (NO internal residual). caller 가 frozen path 와 합산.
    - parallel wiring (Eq.8): h_l = BN(MLP(MP(x_l))) + s1·A1(x_l) + s2·A2(MP(x_l)).
      GIN layer 내부를 분해 호출: MP(x_l) = (1+eps)*x + propagate(...), 그 다음
      BN(MLP(MP)) 가 frozen path. A1 은 x_l 입력, A2 는 MP(x_l) (mlp 이전) 받음.
    - γ=0 초기엔 frozen-only baseline 과 비트 단위 동등 (smoke test 검증).
    - trainable post-pool Linear self.proj[0] (emb_dim=300 → d_h=300) + ReLU.

  vs legacy stl_graphmvp_adaptivegnn.yaml:
    - 명시적으로 adapter_kind="paper" (legacy 도 default 가 paper 라 동일 동작
      이었으나, 본 recipe 는 의도 분명히 함).
    - use_edge_attr 제거 (paper 모드에서 무시). frozen GIN 내부 edge_attr 는
      그대로 사용됨 — adapter 측만 atom-only.
    - adapter_bottleneck 64 유지 (mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6
      과 동일). r=64 × d=300 × 10 block ≈ 384K params trainable.

  STL collate:
    - graphmvp 는 STL 의 **primary** backbone — fusion 없음 → embeddings=[] 로
      두고 ``consumes`` 도 비워둔다 (MTL 처럼 extra_backbone 으로 들어갈 때만
      consumes 사용).
    - collate (``prepare_stl_graphmvp_loaders``) 가 SMILES → PyG Batch 를
      ``batch['graphmvp_data']`` 최상위 키에 넣고, graphmvp adapter 가 그걸
      받는 구조. invalid SMILES 는 1-atom placeholder + presence=False (STL
      단일 backbone 에선 presence mask 무의미; forward 는 안전).

  Loss / Optim:
    - single_task (loss/_base/single_task.yaml): regression=masked_mae,
      classification=bce_with_logits, STL 이므로 task weighting 무관.
    - AdapterGNN paper-faithful + linear head 만 학습 → lr=1e-3 단일.
    - max_epochs=100, patience=15 — adapter 학습 신호 약함 보완. (as trained,
      run 898dfd67a49b; legacy 변형은 patience 20 이었음)

  비교 대상:
    - stl_graphmvp_adaptivegnn.yaml (동일 paper 모드 default).
    - MTL paper-faithful: mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6.yaml
      (동일 backbone/r=64, head=grouped, loss=mixed_task_gradnorm) → MTL ↔ STL
      fair 비교용.
    - Backbone family STL: stl_chemeleon_adaptivegnn_paper.yaml (d_h=2048, depth=3,
      bond-level adapter r=128 × 4).

  ⚠ 가중치 다운로드 필요 (data/weights/graphmvp/graphmvp_hybrid.pth — 없으면
    random-init warning 후 smoke 모드).
