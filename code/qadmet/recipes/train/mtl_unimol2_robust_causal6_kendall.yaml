name: mtl_unimol2_robust_causal6_kendall
kind: train

# UniMol2-LoRA uni-backbone + Kendall UW (mixed_task_uncertainty) + causal6.
#
# mtl_chemeleon_robust_causal6_kendall.yaml 의 backbone 만 UniMol2-LoRA 로 교체한 짝.
# per-modality uni-backbone Kendall 비교 세트 (ch / gm / um / mf) 의 unimol2 축.
#
# ★ um 전용 예외: max_epochs 30 (다른 3개는 20).
#   근거 — mtl_unimol2_lora_gradnorm_lastlinear_causal6 관측 best epoch = 12~22 (mean 15.8,
#   seed3=22 로 20 초과). unimol2 가 가장 늦게 수렴하는 modality → 20ep 로 자르면 일부 seed
#   best 누락 위험 → 30 으로 여유 부여. patience 는 5 로 다른 recipe 와 동일 유지.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # ← 6-group causal

features:
  graph: null
  descriptors: []
  embeddings: [unimol2_lmdb]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: unimol2_lora
    consumes: [unimol2_lmdb]
    kwargs:
      ckpt_path: data/weights/unimol2_84m/modelzoo/84M/checkpoint.pt
      model_size: 84m
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4                 # ← ch recipe 와 동일 (robust_causal6 carry)

loss:
  type: mixed_task_uncertainty     # Kendall UW
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 30                   # ★ um 예외: best epoch 12~22 관측 → 20 빠듯 → 30 여유
  patience: 5                      # 다른 recipe 와 동일
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16                   # UniMol2 OPM N² hard ceiling (상향 불가)
  lr: 0.0005                       # constant LR (head / GroupedHead trunk / Kendall log_vars)
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005                 # UniMol2 LoRA linear_q/linear_v (분리 lr 유지)
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  UniMol2-LoRA uni-backbone + Kendall UW + causal6 6-group.
  per-modality 비교 세트의 unimol2 축 (ch / gm / um / mf 중 um).
  loss / head / dataset / 대부분 trainer 는 다른 3개와 동일하나, max_epochs 만 30.

  예산 예외 근거:
    - mtl_unimol2_lora_gradnorm_lastlinear_causal6 관측 best epoch = 17/14/14/22/12
      (mean 15.8, seed3=22 로 20 초과). 4 modality 중 가장 늦게 수렴.
    - 20ep 통일 시 일부 seed 의 best 누락 위험 → 30 으로 여유. patience 5 동일 유지
      (best 후 5ep 미개선이면 조기 종료 → 30 은 상한일 뿐 대부분 더 일찍 멈춤).
    - 단, 위는 GradNorm/Noam 런 — 본건 Kendall/const-LR 이라 수렴 시점 이동 가능.

  ⚠ 가중치: data/weights/unimol2_84m/modelzoo/84M/checkpoint.pt.

  DDP (2-GPU) — ★ UniMol2 는 static_graph 비호환:
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_unimol2_robust_causal6_kendall.yaml \
      --devices 2 --strategy ddp --find-unused-parameters --no-ddp-static-graph
    - --no-ddp-static-graph: UniMol2 LoRA reducer / static_graph 비호환 (mtl_unimol2_lora_fail.md).
    - --find-unused-parameters: UniMol2 forward 의 conditional 경로 안전판.
    - effective batch 32 = DDP 2-rank × 16.
