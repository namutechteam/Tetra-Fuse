name: mtl_4modality_robust_causal6_nounimol2_pcgrad
kind: train

# mtl_4modality_robust_causal6_nounimol2.yaml 에 PCGrad(gradient surgery) 추가.
# loss 만 변경: mixed_task_uncertainty → mixed_task_uncertainty_pcgrad.
#   = Kendall UW (σ 학습, freeze_log_vars=false) + PCGrad projection.
# 그 외 backbone/fusion/head/trainer 는 부모(nounimol2)와 100% 동일.
# 3-modality = CheMeleon(primary) + MoLFormer-LoRA + GraphMVP.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true
      warmup_epochs: 1
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty_pcgrad   # ← Kendall UW + PCGrad
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false              # σ 학습 (caveat: non-stationary, sigma 로깅으로 감시)
    pcgrad_scope: trunk                 # backbone+fusion+extra_backbones 에만 surgery
    pcgrad_eps: 1.0e-12

trainer:
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
  max_epochs: 20
  patience: 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  # PCGrad 는 manual_optimization → Lightning 자동 gradient_clip_val 미지원.
  # (GradNorm/PCGrad 등 manual-opt recipe 는 클리핑 없이 운용하는 게 본 코드베이스 관례.)

notes: |
  robust_attention 3-modality(nounimol2) + Kendall UW + PCGrad.
  단일 GPU 실행 (manual_optimization, DDP 미사용):
    CUDA_VISIBLE_DEVICES=0 qadmet train \
      --recipe recipes/train/mtl_4modality_robust_causal6_nounimol2_pcgrad.yaml
  진단: pcgrad/conflict_rate, pcgrad/mean_cosine, sigma_* 로깅.
