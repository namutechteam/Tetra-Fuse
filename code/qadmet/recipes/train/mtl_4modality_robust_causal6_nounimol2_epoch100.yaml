name: mtl_4modality_robust_causal6_nounimol2
kind: train

# 3-modality variant excluding only the UniMol2 modality from mtl_4modality_robust_causal6.yaml.
#
# Excluded content (all other axes identical to the parent recipe):
#   - Remove unimol2_lmdb from features.embeddings → [molformer_tokens, graphmvp_data]
#   - Remove unimol2_lora entry from extra_backbones
# Therefore fusion input modality = CheMeleon(primary) + MoLFormer-LoRA + GraphMVP (total 3).
# Since UniMol2 LoRA is removed, the DDP static_graph constraint (reducer.cpp conflict) is also gone.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # 6-group causal

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]   # ← unimol2_lmdb removed
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    # ← unimol2_lora entry removed
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01        # alpha diversity pressure, collapse prevention
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true            # absorb 2048/768/300 scale asymmetry
      warmup_epochs: 1
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
  max_epochs: 100
  patience: 15
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0              # constant LR
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  3-modality variant of mtl_4modality_robust_causal6 excluding UniMol2.
  modality = CheMeleon(primary) + MoLFormer-LoRA + GraphMVP.
  robust_attention fusion + grouped head (causal6 6-group), all settings identical to parent.

  DDP (2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_4modality_robust_causal6_nounimol2.yaml \
      --devices 2 --strategy ddp --find-unused-parameters --no-ddp-static-graph
