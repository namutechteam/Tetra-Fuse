name: mtl_4modality_overfit_sanity_baseline
kind: train

# Baseline (처방 무력화) — overfit 진단의 비교 기준선.
# treatment recipe (mtl_4modality_overfit_sanity.yaml) 와 동일 데이터/구조,
# 4 처방만 모두 OFF.
#
# 무력화 방식:
#   A1)  loss.kwargs.log_var_min: -100.0 → exp(-(-100))=1e43 이지만 학습 중 σ 가
#        그 floor 까지 내려가지 않으므로 사실상 no-clamp 와 동일.
#   B1)  per-group WD → 환경변수 QADMET_LEGACY_WD=1 로 토글 (run_overfit_sanity.sh).
#   B2)  head dropout: 0.2 (default).
#   D1)  gradient_clip_val: 미설정 (lightning Trainer default = 0 = off).
#
# 5-task subset 동일 (DILI / Bioavailability_Ma / CYP3A4_Veith / Half_Life_Obach /
# Solubility_AqSolDB) × 1 seed × 30 epoch / no early-stop.

dataset: !include _base/dataset/tdc_admet_5_sanity.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 768
      tau_init: 2.0
      tau_min: 0.5
      anneal_epochs: 50
      modality_dropout: 0.1
      residual: true
      pre_norm: true
      warmup_epochs: 5
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss:
  type: mixed_task_uncertainty
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: kendall_uncertainty
  kwargs:
    log_var_min: -100.0   # 사실상 no-clamp

trainer:
  seeds: [0]
  max_epochs: 30
  patience: 30
  precision: bf16-mixed
  early_stopping: false
  batch_size: 16
  lr: 0.001
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2
    # gradient_clip_val 미설정 — lightning default 0 (clip 비활성).

notes: |
  Baseline (처방 무력화). 함께 비교: mtl_4modality_overfit_sanity.yaml.
  실행 시 QADMET_LEGACY_WD=1 환경변수로 옛 path (모든 그룹 wd=0) 활성화.
