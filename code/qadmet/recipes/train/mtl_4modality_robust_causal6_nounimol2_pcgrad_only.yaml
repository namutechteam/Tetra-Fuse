name: mtl_4modality_robust_causal6_nounimol2_pcgrad_only
kind: train

# mtl_4modality_robust_causal6_nounimol2.yaml 에서 Kendall UW 를 제거하고 PCGrad 만 적용.
# loss.kwargs.uniform_weight=true → reg_var(0.5/1.0) 평탄화 + σ=1 고정(log_var_reg=0)
#   ⇒ weighted_L_k = L̄_k (모든 task 균등 가중), gradient surgery 만 남음.
# "Kendall UW + PCGrad" (..._pcgrad.yaml) vs "PCGrad only" (본 recipe) ablation.
# 그 외 backbone/fusion/head/trainer 는 부모(nounimol2)와 100% 동일.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true
      warmup_epochs: 1
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty_pcgrad   # PCGrad 분기 (manual_optimization)
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    uniform_weight: true                # ← Kendall UW 제거: 균등 가중 + PCGrad only
    pcgrad_scope: trunk
    pcgrad_eps: 1.0e-12

trainer:
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
  max_epochs: 20
  patience: 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  # PCGrad 는 manual_optimization → Lightning 자동 gradient_clip_val 미지원.
  # (GradNorm/PCGrad 등 manual-opt recipe 는 클리핑 없이 운용하는 게 본 코드베이스 관례.)

notes: |
  robust_attention 3-modality(nounimol2) + PCGrad only (Kendall UW 제거).
  단일 GPU 실행:
    CUDA_VISIBLE_DEVICES=1 qadmet train \
      --recipe recipes/train/mtl_4modality_robust_causal6_nounimol2_pcgrad_only.yaml
  진단: pcgrad/conflict_rate, pcgrad/mean_cosine (sigma 는 고정이라 무의미).
