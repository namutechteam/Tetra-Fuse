name: mtl_dmpnn_robust_polaris_fang
kind: train

# Polaris ADME-Fang 6-task 외부 벤치마크 MTL — D-MPNN(from-scratch, graph-only) baseline.
# TDC-22와 분리된 독립 블록. 6 endpoint 모두 regression(Pearson).
# 우선 실행 가능한 최소 구성: D-MPNN은 synthetic featurize라 feature precompute 불필요.

dataset: !include _base/dataset/polaris_fang_6.yaml

features:
  graph: dmpnn
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include _base/model/dmpnn_default.yaml
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping        # 6 endpoint 단일 group(adme_fang) — polaris_fang.py 참조
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty        # Kendall UW (전부 regression이므로 회귀 항만 활성)
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100                     # scratch 예외 (pretrain warm start 없음)
  patience: 15
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  Polaris ADME-Fang 6-task MTL, D-MPNN(scratch, graph-only). tdcpxr25 D-MPNN recipe와
  동일 옵션, dataset만 polaris_fang_6로 교체. 6 endpoint 단일 head-group.
  작은 두 task(Fang_HPPB n=110, Fang_RPPB n=97)는 STL fallback(polaris_fang_6_pertask)과
  비교 권장. MoLFormer/CheMeleon/GraphMVP/MAP backbone은 Polaris SMILES feature
  precompute 후 parquet_paths 추가하여 동일 recipe 패턴으로 확장.
