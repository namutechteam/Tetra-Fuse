name: mtl_dmpnn_robust_polaris_fang
kind: train

# Polaris ADME-Fang 6-task external benchmark MTL — D-MPNN(from-scratch, graph-only) baseline.
# Independent block, separated from TDC-22. All 6 endpoints are regression (Pearson).
# Minimal runnable configuration first: D-MPNN uses synthetic featurization, so feature precompute is unnecessary.

dataset: !include _base/dataset/polaris_fang_6.yaml

features:
  graph: dmpnn
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include _base/model/dmpnn_default.yaml
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping        # Single group of 6 endpoints (adme_fang) — see polaris_fang.py
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty        # Kendall UW (all tasks are regression, so only the regression term is active)
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100                     # scratch exception (no pretrain warm start)
  patience: 15
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  Polaris ADME-Fang 6-task MTL, D-MPNN(scratch, graph-only). Identical options to the tdcpxr25 D-MPNN recipe,
  only the dataset is replaced with polaris_fang_6. Single head-group for 6 endpoints.
  For the two small tasks (Fang_HPPB n=110, Fang_RPPB n=97), comparison with the STL fallback (polaris_fang_6_pertask)
  is recommended. For the MoLFormer/CheMeleon/GraphMVP/MAP backbone, after precomputing Polaris SMILES features,
  add parquet_paths to extend using the same recipe pattern.
