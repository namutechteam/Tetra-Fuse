name: mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6_pureswap
kind: train

# GraphMVP-major FiLM 변조 + GradNorm (shared_layer=fusion.output_proj) + causal6.
#
# mtl_chemeleon_film_aux_gradnorm_lastlinear_causal6 의 primary swap (major modality 만
# 교체): primary CheMeleon → GraphMVP, CheMeleon 은 보조 modality 로 강등.
# 그 외 fusion/loss/trainer/하이퍼파라미터는 chemeleon recipe 와 100% 동일 (순수 swap).
#
# ⚠ 기존 mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6.yaml (paper-adapter·100ep·
#   output_dim 768 로 다르게 튜닝된 2026-05-21 분기) 와는 다른 파일. 본 recipe 는 chemeleon
#   단기탐색 recipe (20ep, output_dim 300, warmup 1) 를 그대로 따른 순수 swap → _pureswap suffix.
#
# 모달리티 배치 (lit_module: input_dims = [primary backbone, *extra_backbones]):
#   - primary = GraphMVP (backbone, 300d)              → FiLM embeddings[0]
#   - aux     = CheMeleon / MoLFormer-LoRA / UniMol2-LoRA → conditions
#   - z = γ⊙x + β + x, 이후 output_proj(z) (post-fusion Linear, identity-init).
#
# robust_causal6 대비 핵심 차이 (chemeleon recipe 에서 carry):
#   - fusion: robust_attention → film (+ use_output_proj, gamma clamp).
#   - loss:   mixed_task_uncertainty → mixed_task_gradnorm (shared_layer=fusion.output_proj).
#   - trainer.kwargs: accumulate_grad_batches / gradient_clip_val 제거
#     (GradNorm manual optimization 과 비호환 — Lightning configuration_validator raise).

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # ← robust_causal6 (6-group causal)

features:
  graph: chemeleon                           # aux CheMeleon 의 bmg 입력용 (consumes 없음)
  descriptors: []
  embeddings: [graphmvp_data, molformer_tokens, unimol2_lmdb]   # graphmvp_data = primary
  missing_policy: mask_token

model:
  type: multitask
  backbone:                                  # primary = FiLM embeddings[0]
    type: graphmvp
    consumes: [graphmvp_data]
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_dropout: 0.0
      pool: mean
  extra_backbones:                           # CheMeleon 강등 → aux[0], 나머지 동일
    - type: chemeleon
      kwargs:
        d_h: 2048
        checkpoint_path: data/weights/chemeleon_mp.pt
        d_xd: 0
        adapter_dropout: 0.0
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
  fusion:
    type: film
    entropy_weight: 0.0                       # FiLM 은 attention 아님 — entropy reg 미사용
    kwargs:
      output_dim: 300                         # ← chemeleon recipe (사용자 의도; 검증값은 768)
      cond_hidden: 256                         # 보조 condition projection 차원 (3×256 concat)
      condition_dropout: 0.2                   # ← chemeleon recipe (modality_dropout 0.2 정렬)
      residual: true                           # z = γ⊙x + β + x
      pre_norm: true                           # GraphMVP 300 vs aux 2048/768/768 scale 흡수
      film_init_identity: true                 # γ_pre=0, β=0 시작 → identity modulation
      warmup_epochs: 1                         # ← chemeleon recipe fusion warmup (20ep 단기)
      use_output_proj: true                    # fused z 위 post-fusion Linear (300→300, identity).
                                               # GradNorm shared_layer (아래) — 항상 trainable,
                                               # warmup 영향/cache 잠금 회피.
      gamma_min: 0.3                           # γ lower bound: residual 과 함께면 x 계수 γ+1 →
      gamma_max: 3.0                           # ≥1.3 보장, primary washout(γ→-1) 차단. w_k clamp 와 동일 철학.
  head:
    type: grouped
    routing: taskset_grouping                  # 코드 게이트 — 실제 grouping 은 TaskSet.initial_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_gradnorm                    # ← gradnorm (manifest 60248bff73fa 구조)
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null                         # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                                 # restoring force (Chen 2018, ADMET asymmetric)
    shared_layer: fusion.output_proj           # fused z 의 post-fusion Linear (single W).
                                               # 모든 22 task forward 통과 + 항상 trainable →
                                               # resolver cache 잠금/ warmup freeze 이슈 회피.
                                               # w_k clamp [0.3, 3.0] 는 lit_module 자동 적용.

trainer:
  seeds: [0, 1, 2, 3, 4]                       # ← chemeleon recipe
  max_epochs: 20                               # ← chemeleon recipe (단기 탐색)
  patience: 5                                  # ← chemeleon recipe
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16                               # UniMol2 OPM N² hard ceiling
  lr: 0.0005                                   # ← chemeleon recipe (constant LR)
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0                             # constant LR (Noam 무효화 — init=final=peak)
  lr_lora: 0.00005                             # ← chemeleon recipe
  lr_fusion: 0.0001                            # ← chemeleon recipe (gate collapse 방어)
  num_workers: 4
  predict_ckpt: best
  kwargs: {}                                   # ← gradnorm: accumulate_grad_batches /
                                               #   gradient_clip_val 제거 (manual opt 비호환).
                                               #   effective batch 32 = DDP 2-rank × 16.

notes: |
  GraphMVP primary + (CheMeleon / MoLFormer-LoRA / UniMol2-LoRA) FiLM 변조 + GradNorm,
  causal6 6-group. mtl_chemeleon_film_aux_gradnorm_lastlinear_causal6 에서 primary 만
  CheMeleon→GraphMVP 로 교체한 순수 swap (fusion/loss/trainer/하이퍼파라미터 100% 동일).

  ⚠ 기존 mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6 (paper-adapter·100ep·output_dim
    768) 와 다른 파일 — 본 recipe 는 chemeleon 단기탐색 recipe 의 순수 swap.

  Fusion (FiLM):
    - x = primary_proj(H_graphmvp 300d) → 300d
    - γ,β = MLP(concat(cond_proj(H_chemeleon 2048d), cond_proj(H_molformer 768d),
                       cond_proj(H_unimol2 768d))) ∈ R^{300}
    - z = γ⊙x + β + x  →  output_proj(z)  (post-fusion Linear 300→300, identity-init)
    - γ clamp [0.3, 3.0]: residual 의 x 계수(γ+1)를 ≥1.3 으로 묶어 primary washout 차단.
    - identity init (γ_pre=0, β=0, output_proj=I) + warmup 1 epoch → 초기엔 GraphMVP 단독.

  Loss / Optim:
    - mixed_task_gradnorm: shared_layer=fusion.output_proj 의 ∥∇W L_k∥ 로 task-difficulty
      proxy 측정 (fused z 를 직접 처리하는 last shared Linear). α=1.5, w_k∈[0.3,3.0] 자동 clamp.
      LitModule manual optimization (L_main / L_grad 2-step backward).
    - lr=5e-4(constant) / lr_lora=5e-5 / lr_fusion=1e-4 분리 (chemeleon recipe 에서 carry).

  비교 대상:
    - 동일 fusion/loss + CheMeleon primary: mtl_chemeleon_film_aux_gradnorm_lastlinear_causal6.
    - 동일 fusion + GraphMVP primary + Kendall UW:
      mtl_graphmvp_film_aux_kendall_lastlinear_causal6_pureswap.
    - 동일 GraphMVP primary, paper-adapter/100ep 튜닝본:
      mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6.

  ⚠ 가중치 필요: data/weights/graphmvp/graphmvp_hybrid.pth (primary, 없으면 random-init warning),
     data/weights/chemeleon_mp.pt (aux),
     MoLFormer / UniMol2 84M ckpt (각 LoRA base).

  DDP 권장 (2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6_pureswap.yaml \
      --devices 2 --strategy ddp --find-unused-parameters --no-ddp-static-graph
    - find-unused-parameters: GradNorm manual_opt + FiLM warmup 경계 trainable subset 변동.
    - no-ddp-static-graph: UniMol2 LoRA reducer 충돌 + warmup(epoch 1) film_gen
      requires_grad False→True 전환으로 static graph 가정 붕괴.
