name: mtl_4modality_robust_causal6_frozen
kind: train

# mtl_4modality_robust_causal6.yaml 의 frozen-backbone ablation.
#   - LoRA(molformer/unimol2) / AdapterGNN(chemeleon/graphmvp) 전부 제거.
#   - 4 modality 모두 frozen 사전계산 임베딩으로 fusion 에 직접 투입:
#       chemeleon_frozen(2048) = primary mlp_embedding passthrough backbone (consumes)
#       graphmvp_frozen(300) / molformer(768) / unimol2(768) = fusion modality
#   - 학습되는 것: fusion + head 만 (backbone passthrough=Identity, 파라미터 0).
#   - fusion/head/loss/trainer 는 base 와 동일 — backbone 만 frozen 으로 바꾼 순수 ablation.
#   - UniMol2 OPM forward 가 사라져 batch ceiling 무관하지만, base 비교 위해 batch=16 유지.

dataset: !include _base/dataset/tdc_admet_22_causal6_frozen.yaml

features:
  graph: null                 # graph backbone 없음 (primary = mlp_embedding passthrough)
  descriptors: []
  embeddings: [chemeleon_frozen, graphmvp_frozen, molformer, unimol2]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: mlp_embedding         # passthrough: chemeleon_frozen(2048) 그대로 fusion 입력
    consumes: [chemeleon_frozen]
    kwargs:
      input_dim: 2048
  # extra_backbones 없음 — graphmvp_frozen/molformer/unimol2 는 fusion modality 로 직접.
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true            # 2048/300/768/768 scale 비대칭 흡수 (frozen 이라 더 중요)
      warmup_epochs: 1
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 20
  patience: 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  frozen-backbone ablation (no LoRA/adapter). 4 modality 전부 frozen 사전계산 임베딩.
  사전계산 필요: data/embeddings/{chemeleon_frozen,graphmvp_frozen}.parquet
    (precompute_chemeleon_frozen / precompute_graphmvp_frozen recipe 로 생성).
  ⚠ DDP launch 시 --no-ddp-static-graph --find-unused-parameters
    (fusion warmup gate-freeze 가 epoch 0 에서 unused params 유발).
  실행 예 (torchrun, 2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_4modality_robust_causal6_frozen.yaml \
      --devices 2 --strategy ddp --no-ddp-static-graph --find-unused-parameters
