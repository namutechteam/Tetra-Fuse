name: mtl_chemeleon_film_aux
kind: train

# 새 fusion 전략: CheMeleon main + (MoLFormer/UniMol2/GraphMVP) 보조 → FiLM modulation.
# 4-modality "동등 fusion" (RobustAttention) 에서의 alpha collapse / overfit 문제 회피.
#
# 설계:
#   - primary backbone = CheMeleon (frozen + AdaptorGNN). embeddings[0] 위치.
#   - 보조 backbone 3 종 = MoLFormer-LoRA, UniMol2-LoRA, GraphMVP frozen GIN.
#     각 backbone 출력 H_i 가 fusion modality 로 들어감.
#   - FilmFusion: x = primary_proj(H_chem) → γ,β = MLP(concat(c_proj(H_aux_i)))
#                z = γ⊙x + β + x  (residual)
#   - identity-init: γ_pre=0, β=0 시작 → epoch 0 에서 z = 2x (residual+identity).
#                    학습이 진행될수록 보조 modality 가 modulation 으로 개입.
#   - warmup 15 epoch: film_gen freeze + (γ=1, β=0) → CheMeleon 단독 학습으로 시작.
#
# 그 외 (σ freeze, head dropout 0.4, lr 5e-4, lr_lora 3e-5, lr_fusion 5e-5) 는
# mtl_4modality_v2_reg_strong.yaml 의 처방을 그대로 carry over (fair compare 목적).

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: film
    entropy_weight: 0.0       # FiLM 은 attention 아님 — entropy reg 미사용
    kwargs:
      output_dim: 768          # primary projection 차원 (head 입력 차원)
      cond_hidden: 256         # 보조 condition projection 차원 (3×256=768 concat)
      condition_dropout: 0.15  # 학습 중 보조 condition 의 sample-wise zero-out
      residual: true           # z = γ⊙x + β + x
      pre_norm: true           # CheMeleon 2048 vs aux 768/768/300 scale 흡수
      film_init_identity: true # γ_pre=0, β=0 시작 → identity modulation
      warmup_epochs: 15        # 처음 15 epoch 은 CheMeleon 단독 학습
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: kendall_uncertainty
  kwargs:
    freeze_log_vars: true       # σ=1 고정 (Kendall 자유도 무력화)

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005                    # 1e-3 → 5e-4 (v2 캐리)
  lr_lora: 0.00003              # 5e-5 → 3e-5
  lr_fusion: 0.00005            # FiLM gen + projections (gate slowdown)
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2
    gradient_clip_val: 1.0

notes: |
  CheMeleon main + (MoLFormer/UniMol2/GraphMVP) FiLM 변조. 4-modality 동등 fusion
  (mtl_4modality_v2/v3) 와 별도 run_id. 보조 modality 가 primary 표현을 affine
  변조 (z = γ⊙x + β + x) — alpha attention 의 winner-take-all collapse 회피.
  hyper-parameter (lr, σ freeze, dropout) 은 v2_reg_strong 그대로 carry over.
