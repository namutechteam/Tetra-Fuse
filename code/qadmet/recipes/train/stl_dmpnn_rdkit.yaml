name: stl_dmpnn_rdkit
kind: train

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: dmpnn
  descriptors: [rdkit2d]
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone: !include _base/model/dmpnn_default.yaml
  # fusion 미사용 — descriptors 만 쓰므로 X_d concat 으로 흡수.
  head:
    type: linear

loss: !include _base/loss/single_task.yaml

trainer: !include _base/trainer/default.yaml

notes: |
  옛 phase2 STL D-MPNN + RDKit2D 200-dim. Per-task per-seed (22 × 5 = 110) 모델.

  데이터 경로 (Step B, 2026-05-01):
    rdkit2d 는 chemprop ``MPNN.fingerprint`` 의 X_d 자리에 concat → backbone output
      = d_h(300) + 200 = 500. 옛 phase2 와 동일 backbone 구조 (X_d concat 부활).
