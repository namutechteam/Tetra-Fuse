name: mtl_chemeleon_molformer_unimol2_lora_v2
kind: train

# v2: alpha collapse 대응 — Tier 1
#   A. lr_fusion=1e-4 (gate slowdown, lr=1e-3 의 1/10) → backbone catch-up 시간 확보
#   B. fusion warmup_epochs=5 → 처음 5 epoch 동안 gate freeze + alpha=1/K 균등
#      → CheMeleon AdaptorGNN / MoLFormer LoRA / UniMol2 LoRA 가 task 에 적응할 시간

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 768
      tau_init: 2.0
      tau_min: 0.5
      anneal_epochs: 50
      modality_dropout: 0.1
      residual: true
      pre_norm: true
      warmup_epochs: 5
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include _base/loss/mixed_kendall.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.001
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2

notes: |
  v2 변경점 (alpha collapse 대응 — Tier 1 A+B):
    - trainer.lr_fusion=1e-4 (gate/projections lr 분리, backbone lr_lora=5e-5 와 같은 자릿수)
    - fusion.kwargs.warmup_epochs=5 (5 epoch 간 alpha 균등 hard-coded, gate freeze)

  나머지는 v1 (mtl_chemeleon_molformer_unimol2_lora.yaml) 과 동일.
