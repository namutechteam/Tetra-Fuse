name: mtl_4modality_overfit_sanity
kind: train

# 4-modality overfit 진단용 sanity recipe (5 task × 1 seed × 30 epoch).
#
# Why:
#   mtl_chemeleon_molformer_unimol2_graphmvp 학습이 ep4~5 부터 train↓/val↑ 로
#   분기하는 구조적 overfit 을 보임. GroupedHead + Kendall log_var 의 자유도가
#   데이터 (DILI 379, Bioavailability_Ma 512, Half_Life 667) 대비 과한 것이 가설.
#
# 적용 처방 (보수적 패키지):
#   A1)  log_var floor min=-2.0 (mixed_task.py 내장 default — 자동 적용)
#   A1+) fusion log_precision clamp [-2,2] (uncertainty_attention.py 내장 — robust 사용 시 무영향)
#   B1)  per-group WD: head=0.05 / fusion=0.01 / adaptor=0.01 / LoRA=0 / norm·bias·log_var=0
#        (configure_optimizers 자동 적용)
#   B2)  head dropout 0.2 → 0.4 (아래 model.head.kwargs 에 명시)
#   D1)  gradient_clip_val=1.0 (아래 trainer.kwargs)
#   aux loss: OFF (model.aux_loss 미설정 = None)
#
# 검증:
#   - val_loss epoch trace 가 ep4~5 부근에서 더이상 급반전하지 않음
#   - sigma trace 가 모든 task 에서 -2 floor 위에 머무르거나, 일부 task 가 floor 에 닿음
#   - alpha 분포가 4 modality 모두 ≥ 0.05 유지

dataset: !include _base/dataset/tdc_admet_5_sanity.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 768
      tau_init: 2.0
      tau_min: 0.5
      anneal_epochs: 50
      modality_dropout: 0.1
      residual: true
      pre_norm: true
      warmup_epochs: 5
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 64
      dropout: 0.5

loss: !include _base/loss/mixed_kendall.yaml

trainer:
  seeds: [0]
  max_epochs: 30
  patience: 30
  precision: bf16-mixed
  early_stopping: false
  batch_size: 16
  lr: 0.001
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2
    gradient_clip_val: 1.0

notes: |
  4-modality overfit sanity (5 task × 1 seed × 30 epoch, no early stop).
  보수적 처방 적용 (σ floor / per-group WD / head dropout 0.4 / grad_clip 1.0).
  비교: 동일 5-task subset 으로 변경 전 git 상태에서 한 번 더 학습 후 진단.
