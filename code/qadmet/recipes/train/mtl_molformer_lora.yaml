name: mtl_molformer_lora
kind: train

dataset: !include _base/dataset/tdc_admet_22_mech.yaml

features:
  graph: null
  descriptors: []
  embeddings: [molformer_tokens]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: molformer_lora
    consumes: [molformer_tokens]
    kwargs:
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss:
  type: mixed_task_gradnorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null            # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                    # restoring force (Chen 2018 ADMET asymmetric 권장)
    # 마지막 LoRA layer 의 value q-projection (resolver 가 frozen Linear.weight 건너
    # 뛰고 그 안의 lora_A + lora_B 만 추출 → 24k param 단일 proxy). 모든 22 task 의
    # backward 가 통과하면서 backbone 전체 LoRA delta 대비 노이즈 1/24. Chen 2018
    # last-shared-layer proxy 와 정신적으로 등가 (PEFT 환경의 'shared trainable layer').
    shared_layer: backbone.molformer.base_model.model.encoder.layer.11.attention.self.value

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001          # head / GroupedHead trunk / Kendall log_vars
  lr_lora: 0.00005   # MoLFormer LoRA q/v
  num_workers: 4

notes: |
  단일 backbone MTL — MoLFormer-XL + LoRA (q/v rank=16).

  Backbone:
    - ibm/MoLFormer-XL-both-10pct base frozen, LoRA delta (q/v) 만 학습.
    - 보조 modality 없음, fusion 없음 → primary backbone 출력 (768-d pooler) 직결.
    - 입력: precomputed token_ids/attention_mask (molformer_tokens.parquet, MAX_LEN=202).
    - primary backbone 도 MTL 에서는 ``consumes`` 명시 → ``__consumed__`` slot 경유
      (mtl_unimol2_lora_only.yaml 패턴과 동일).

  Routing:
    - dataset = tdc_admet_22_mech (routing.md mechanism-aligned 7-group).
    - head.routing = taskset_grouping (코드 경로 게이트; 실제 grouping 은 TaskSet 의
      ADMET_7_GROUP_MECH).

  Loss / Optim:
    - mixed_task_gradnorm (bce + masked_mae + GradNorm dynamic task weighting).
      shared_layer=backbone → MoLFormer-LoRA trainable delta (q/v) 의 ∥∇_W L_k∥ 로
      각 task w_k 를 학습. α=1.5 (asymmetric). w 는 step 마다 sum=K 로 renormalize.
      LitModule 가 manual optimization 모드로 두 step (L_main / L_grad) backward.
    - lr_lora=5e-5 / lr=1e-3 분리 (옛 run_stl_molformer_lora.py 와 동등).

  비교 대상:
    - STL: stl_molformer_lora.yaml (동일 backbone 설정, head=linear).
    - Multi-modal: mtl_chemeleon_molformer_lora.yaml (CheMeleon + MoLFormer fusion 버전).
