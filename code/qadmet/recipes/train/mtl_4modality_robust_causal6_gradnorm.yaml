name: mtl_4modality_robust_causal6_gradnorm
kind: train

# mtl_4modality_robust_causal6.yaml 의 task-weighting ablation:
#   Kendall uncertainty weighting → GradNorm (Chen et al. 2018) 로 교체.
#   loss 블록만 변경, 나머지(4 live backbone adapter/LoRA + robust_attention + head + trainer)
#   는 base 와 동일 — 순수 task-weighting 비교.
#
# GradNorm shared_layer = fusion.projs.0 (robust_attention 의 chemeleon-modality
#   projection Linear 2048→300). robust_attention 은 output_proj 가 없고 gate 는
#   warmup(epoch 0) 에 freeze 되어 resolver cache 충돌 → projs 는 warmup 중에도
#   항상 trainable 이라 안전. w_k clamp [0.3,3.0] 는 lit_module 에 이미 적용됨.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true
      warmup_epochs: 1
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_gradnorm           # ← Kendall UW 대신 GradNorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null                # GradNorm 은 uniform 강제 (kendall 과 상호배타)
  kwargs:
    alpha: 1.5                        # restoring force (Chen 2018, ADMET asymmetric 권장)
    shared_layer: fusion.projs.0      # robust_attention chemeleon-modality proj (warmup-safe)

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 20
  patience: 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  # GradNorm 은 manual optimization → Lightning 자동 gradient_clip / accumulate 불가.
  # (clip 필요 시 lit_module._gradnorm_training_step 내부에서 수동 처리)

notes: |
  task-weighting ablation: Kendall UW → GradNorm. base(mtl_4modality_robust_causal6,
  Kendall, TDC mean rank 8.59) 와 동일 설정 + loss 만 교체.
  ⚠ live backbone fine-tune (adapter/LoRA) — frozen precompute 와 무관, ~90분/seed.
  ⚠ DDP launch: --no-ddp-static-graph --find-unused-parameters (fusion warmup gate-freeze).
  실행 예:
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_4modality_robust_causal6_gradnorm.yaml \
      --devices 2 --strategy ddp --no-ddp-static-graph --find-unused-parameters
