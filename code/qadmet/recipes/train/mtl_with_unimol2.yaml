name: mtl_with_unimol2
kind: train

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: dmpnn
  descriptors: [rdkit2d, xtb]
  embeddings: [unimol2]
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include _base/model/dmpnn_default.yaml
  fusion:
    type: attention
    fallback: gated
    kwargs:
      output_dim: 300
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include _base/loss/mixed_kendall.yaml

trainer: !include _base/trainer/default.yaml

notes: |
  옛 phase1.4a variantB: D-MPNN + frozen Uni-Mol2 84M CLS embedding (768-dim).

  데이터 경로 (Step B, 2026-05-01):
    descriptors (rdkit2d 200 + xtb 4 = 204) → DMPNN X_d concat → backbone output
      = d_h(300) + 204 = 504.
    embeddings (unimol2 768) → fusion modality.
    AttentionFusion(K=2) 입력 = [DMPNN-fp(504), UniMol2(768)] → output 300.

  ETKDG 실패 분자는 zeros 로 채움 — missing_policy=mask_token 이 마스킹.
  TODO(연구방향): UniMol2-LoRA 가 frozen embedding 보다 우선 (MEMORY).
