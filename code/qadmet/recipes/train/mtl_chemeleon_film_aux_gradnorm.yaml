name: mtl_chemeleon_film_aux_gradnorm
kind: train

# mtl_chemeleon_film_aux 의 routing+loss ablation 분기:
#   - dataset: tdc_admet_22 → tdc_admet_22_mech (mechanism-aligned 7-group)
#   - loss:    Kendall UW (σ freeze) → GradNorm (shared_layer=fusion, α=1.5)
#     · task_weighting / Kendall σ 모두 off — GradNorm 단독 동적 가중.
# 그 외 (FiLM 변조, warmup 15, head dropout 0.4, lr 5e-4, lr_lora 3e-5, lr_fusion 5e-5,
# bf16-mixed, accum=2, clip=1.0) 는 mtl_chemeleon_film_aux / v2_reg_strong 그대로 carry over.
#
# 설계 (변경 없음):
#   - primary backbone = CheMeleon (frozen + AdaptorGNN). embeddings[0] 위치.
#   - 보조 backbone 3 종 = MoLFormer-LoRA, UniMol2-LoRA, GraphMVP frozen GIN.
#   - FilmFusion: x = primary_proj(H_chem) → γ,β = MLP(concat(c_proj(H_aux_i)))
#                z = γ⊙x + β + x  (residual)
#   - identity-init: γ_pre=0, β=0 시작 → epoch 0 에서 z = 2x.
#   - warmup 15 epoch: film_gen freeze + (γ=1, β=0) → CheMeleon 단독 학습으로 시작.

dataset: !include _base/dataset/tdc_admet_22_mech.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: film
    entropy_weight: 0.0       # FiLM 은 attention 아님 — entropy reg 미사용
    kwargs:
      output_dim: 768          # primary projection 차원 (head 입력 차원)
      cond_hidden: 256         # 보조 condition projection 차원 (3×256=768 concat)
      condition_dropout: 0.15  # 학습 중 보조 condition 의 sample-wise zero-out
      residual: true           # z = γ⊙x + β + x
      pre_norm: true           # CheMeleon 2048 vs aux 768/768/300 scale 흡수
      film_init_identity: true # γ_pre=0, β=0 시작 → identity modulation
      warmup_epochs: 15        # 처음 15 epoch 은 CheMeleon 단독 학습
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_gradnorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null            # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                    # restoring force (Chen 2018 ADMET asymmetric)
    shared_layer: fusion          # FilmFusion 전체 (primary_proj + cond_projs + film_gen).
                                  # resolver 가 trainable 만 필터 → warmup 동안에는
                                  # primary_proj + cond_projs.* 의 ∥∇W L_k∥, epoch 15
                                  # 이후 film_gen 까지 포함. FiLM 구조상 "concat-후
                                  # shared Linear" 가 없어 모듈 전체로 multimodal
                                  # gradient signal 을 잡음.

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 40                  # warmup_epochs(15) 동안 best val_loss 가 일찍 잡혀도
                                # post-warmup 충분히 학습되도록 (epoch ~42 까지 보장).
                                # 이전 patience=20 으로 epoch 22 조기-stop 한 케이스 대응.
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005                    # 1e-3 → 5e-4 (v2 캐리)
  lr_lora: 0.00003              # 5e-5 → 3e-5
  lr_fusion: 0.00005            # FiLM gen + projections (gate slowdown)
  num_workers: 4
  # GradNorm = manual optimization → Lightning 의 accumulate_grad_batches /
  # gradient_clip_val 모두 비호환 (configuration_validator 가 raise).
  # 원본 v2 처방의 effective batch 32 는 DDP 2-rank × per-GPU batch 16 으로 보전.
  # gradient_clip 은 mtl_chemeleon_adaptivegnn 와 동일하게 생략.

notes: |
  mtl_chemeleon_film_aux 의 routing+loss ablation 분기. CheMeleon main +
  (MoLFormer/UniMol2/GraphMVP) FiLM 변조 구조는 동일.

  Routing:
    - dataset = tdc_admet_22_mech (routing.md mechanism-aligned 7-group).
    - head.routing = taskset_grouping (코드 게이트; 실제 grouping 은 TaskSet 의
      initial_grouping = ADMET_7_GROUP_MECH).

  Loss / Optim:
    - mixed_task_gradnorm (bce + masked_mae + GradNorm dynamic task weighting).
      shared_layer=fusion → FilmFusion 모듈 전체의 trainable param 으로 ∥∇W L_k∥
      측정. α=1.5 (ADMET asymmetric). w 는 step 마다 sum=K renormalize.
      LitModule 가 manual optimization 모드로 두 step (L_main / L_grad) backward.
    - FiLM warmup 15 epoch 동안 film_gen frozen → resolver 가 자동으로
      primary_proj + cond_projs.* 만 사용. epoch 15 이후 film_gen 까지 포함되어
      trainable param set 이 확장됨 (경계에서 w_k 일시 동요 가능, sum=K 가 흡수).
    - Kendall UW(σ=1 freeze) 와 task_weighting 모두 off — GradNorm 단독.

  Hyper-parameter:
    - precision=bf16-mixed, batch_size=16, lr=5e-4, lr_lora=3e-5, lr_fusion=5e-5 —
      v2_reg_strong 에서 carry over. 단 accumulate_grad_batches / gradient_clip_val
      은 GradNorm manual optimization 과 비호환이라 제거. effective batch 32 는
      DDP 2-rank × per-GPU 16 으로 보존.

  비교 대상:
    - 동일 hyperparam + Kendall UW: mtl_chemeleon_film_aux.
    - 동일 routing + 단일 backbone GradNorm: mtl_chemeleon_adaptivegnn.

  DDP 권장 옵션:
    - torchrun --nproc_per_node=2 -m qadmet.cli.main train \
        --recipe recipes/train/mtl_chemeleon_film_aux_gradnorm.yaml \
        --devices 2 --strategy ddp \
        --find-unused-parameters --no-ddp-static-graph
    - find-unused-parameters: GradNorm manual_opt 에서 step 별 trainable subset 변동.
    - no-ddp-static-graph: warmup_epochs 경계 (epoch 15) 에서 film_gen 의
      requires_grad 가 False→True 로 전환되므로 static graph 가정이 깨짐.
