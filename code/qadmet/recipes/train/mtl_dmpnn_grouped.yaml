name: mtl_dmpnn_grouped
kind: train

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: dmpnn
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include _base/model/dmpnn_default.yaml
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include _base/loss/mixed_kendall.yaml

trainer: !include _base/trainer/default.yaml

notes: |
  옛 phase1.1 대응: D-MPNN backbone + 7-group GroupedHead + mixed Kendall uncertainty.
  보조 modality 없음 (graph-only). 가장 작은 baseline.
