name: mtl_unimol2_lora
kind: train

dataset: !include _base/dataset/tdc_admet_22_mech.yaml

features:
  graph: null
  descriptors: []
  embeddings: [unimol2_lmdb]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: unimol2_lora
    consumes: [unimol2_lmdb]
    kwargs:
      ckpt_path: data/weights/unimol2_84m/modelzoo/84M/checkpoint.pt
      model_size: 84m
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss:
  type: mixed_task_gradnorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null            # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                    # restoring force (Chen 2018 ADMET asymmetric 권장)
    # 마지막 LoRA layer (idx=11) 의 linear_v (resolver 가 frozen Linear.weight 건너
    # 뛰고 lora_A + lora_B 만 추출 → 24k param 단일 proxy). 모든 22 task 의 backward
    # 가 통과하면서 backbone 전체 LoRA delta 대비 노이즈 1/24. Chen 2018
    # last-shared-layer proxy 와 정신적으로 등가 (PEFT 환경의 'shared trainable layer').
    shared_layer: backbone.unimol2.base_model.model.encoder.layers.11.self_attn.linear_v

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.001          # head / GroupedHead trunk / Kendall log_vars
  lr_lora: 0.00005   # UniMol2 LoRA linear_q/linear_v
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2

notes: |
  단일 backbone MTL — UniMol2 84M + LoRA (linear_q/linear_v rank=16).

  Backbone:
    - UniMol2 84M frozen, LoRA delta 만 학습.
    - 보조 modality 없음, fusion 없음 → primary backbone 출력 (768-d) 직결.
    - 입력: 옛 precompute LMDB (data/embeddings/unimol2_features.lmdb).
    - ETKDG 실패 분자는 LMDB 에 None — collate 가 제거 (빈 batch step skip).
    - primary backbone 도 MTL 에서는 ``consumes`` 명시 → ``__consumed__`` slot 경유.

  Routing:
    - dataset = tdc_admet_22_mech (routing.md mechanism-aligned 7-group).
    - head.routing = taskset_grouping (코드 경로 게이트; 실제 grouping 은 TaskSet 의
      ADMET_7_GROUP_MECH).

  Loss / Optim:
    - mixed_task_gradnorm (bce + masked_mae + GradNorm dynamic task weighting).
      shared_layer=backbone → UniMol2-LoRA trainable delta (q/v) 의 ∥∇_W L_k∥ 로
      각 task w_k 를 학습. α=1.5 (asymmetric). w 는 step 마다 sum=K 로 renormalize.
      LitModule 가 manual optimization 모드로 두 step (L_main / L_grad) backward.
    - lr_lora=5e-5 / lr=1e-3 분리 (옛 run_stl_unimol2_lora.py 와 동등).
    - bf16-mixed + batch=16 + accum=2 (effective 32) — mtl_unimol2_lora_only.yaml 의
      메모리 검증된 설정 계승.
    - DDP 시 UniMol2 의 static_graph 비호환 (mtl_unimol2_lora_fail.md) +
      gradnorm 의 manual two-step backward 때문에
      ``--find-unused-parameters --no-ddp-static-graph`` 둘 다 필요.

  비교 대상:
    - STL: stl_unimol2_lora.yaml (동일 backbone 설정, head=linear).
    - Diagnostic variant: mtl_unimol2_lora_only.yaml (single seed × 30 epoch, Step 2 진단용).
      본 recipe 는 동일 backbone 구성을 production grade (5 seeds × 100 epoch + mech routing)
      로 재실행.
