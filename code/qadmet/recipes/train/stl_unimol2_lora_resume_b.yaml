name: stl_unimol2_lora_resume_b
kind: train

dataset:
  name: tdc_admet_22
  split: scaffold_5seed
  seeds: [1, 2, 3, 4, 5]
  kwargs:
    lmdb_path: data/embeddings/unimol2_features.lmdb
    task_filter:
      - CYP2D6_Veith
      - CYP2D6_Substrate_CarbonMangels
      - hERG
      - Caco2_Wang
      - Solubility_AqSolDB
      - PPBR_AZ
      - VDss_Lombardo
      - Clearance_Hepatocyte_AZ
      - Clearance_Microsome_AZ
      - LD50_Zhu

features:
  graph: null
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: unimol2_lora
    kwargs:
      ckpt_path: data/weights/unimol2_84m/modelzoo/84M/checkpoint.pt
      model_size: 84m
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [1, 2, 3, 4, 5]
  max_epochs: 20
  patience: 5
  precision: 32-true
  early_stopping: true
  batch_size: 8
  lr: 0.001
  lr_lora: 0.00005
  num_workers: 2

notes: |
  stl_unimol2_lora 의 resume 절반 B — 원본 22-task 중 10개 (원본 순서 유지).
  GPU 1 에 단독 실행. OOM 회피용 batch_size 16→8, 환경 변수
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True 권장.
