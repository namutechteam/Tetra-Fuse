name: mtl_chemeleon_molformer_unimol2_lora_v2_aux
kind: train

# Step 2 정식: per-modality aux loss 진단 + regularization.
#
# 동기 (v2 결과):
#   - UniMol2 alpha 가 5% 로 collapse — backbone 자체 문제인지 fusion 미스배분인지 분리 불가능.
#   - aux_loss/i 가 modality i 단독으로 22 task 를 푸는 능력을 직접 측정.
#
# 기대 신호:
#   - aux_loss/0 (CheMeleon), aux_loss/1 (MoLFormer LoRA): 떨어짐 → backbone 정상.
#   - aux_loss/2 (UniMol2 LoRA): 떨어지면 backbone 정상 (fusion 이 죽인 것),
#     plateau 면 backbone (또는 LoRA hp) 자체 문제.
#
# 변경점 (vs v2):
#   - model.aux_loss 추가 (weight=0.1, head_type=linear)
#     → 각 backbone 출력 H_i 에 Linear(D_i, 22) + 별도 Kendall log_vars
#   - trainer.seeds: [0,1,2,3,4] → [0]  (진단 1 seed)
#   - trainer.max_epochs: 100 → 30, patience: 20 → 10
#
# 검증된 batch=16+accum=2 (effective 32) 유지.

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 768
      tau_init: 2.0
      tau_min: 0.5
      anneal_epochs: 50
      modality_dropout: 0.1
      residual: true
      pre_norm: true
      warmup_epochs: 5
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2
  aux_loss:
    weight: 0.1
    head_type: linear

loss: !include _base/loss/mixed_kendall.yaml

trainer:
  seeds: [0]
  max_epochs: 30
  patience: 10
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.001
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2

notes: |
  Per-modality aux loss 진단 recipe.
  본 recipe 의 train_loss = main_loss + 0.1 * (aux_0 + aux_1 + aux_2).
  val_loss 는 main 만 (early-stop 신호 보존). 각 aux_loss/i 는 epoch별 로깅.
  결과 해석:
    - aux_loss/2 (UniMol2) 가 ep30 까지 plateau: UniMol2 LoRA 자체 문제 → rank/lr 재설계.
    - aux_loss/2 가 떨어짐: backbone 정상, fusion 이 모달리티 가중치를 잘못 줘서 죽인 것 → fusion 교체.
