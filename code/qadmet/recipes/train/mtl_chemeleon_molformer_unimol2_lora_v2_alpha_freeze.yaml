name: mtl_chemeleon_molformer_unimol2_lora_v2_alpha_freeze
kind: train

# Step 1 진단: alpha = 1/K 영구 freeze
#   - 동기: v2 MAIN seed_0 결과에서 best=ep4=warmup 마지막 → uniform alpha 가 일반화 최적,
#     gate 풀린 ep5+ 즉시 val_loss 단조 악화 (-2.44 → +5.37).
#   - 시나리오 분리:
#       A. "gate 가 문제" → freeze 시 ep4 이후도 val_loss 개선 → 본 학습은 fusion 교체 (sum+LN/FiLM)
#       B. "UniMol2 backbone 문제" → freeze 해도 ep4 부근에서 정체 → per-modality aux loss 진단
#
# 변경점 (vs v2):
#   - fusion.kwargs.warmup_epochs: 5 → 999  (사실상 영구 freeze; gate.requires_grad=False 유지)
#
# 나머지는 v2 동일 (검증된 batch=16 + accum=2 = effective 32).

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 768
      tau_init: 2.0
      tau_min: 0.5
      anneal_epochs: 50
      modality_dropout: 0.1
      residual: true
      pre_norm: true
      warmup_epochs: 999
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include _base/loss/mixed_kendall.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.001
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2

notes: |
  Step 1 진단 recipe (alpha 1:1:1 영구 freeze).
  - warmup_epochs=999 = effectively permanent uniform alpha.
  - 5 seeds × 100 epochs (patience=20). best epoch + val_loss 추이로
    "gate 만 문제" vs "UniMol2 backbone 문제" 판별.
