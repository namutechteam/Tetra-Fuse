name: stl_dmpnn_paper_gradclip
kind: train

# STL D-MPNN graph-only baseline (paper-faithful control), with gradient clipping.
# stl_dmpnn_paper_seed01234.yaml uses lr=1e-3 flat schedule + no grad clip, causing
# full-backbone scratch D-MPNN training to diverge across multiple task/seed (best_val=inf,
# Bioavailability_Ma AUROC 0.408, etc.) → broken control with TDC mean rank 18.45.
# This variant adds only gradient_clip_val=1.0 to the same protocol to prevent divergence.
# (PEFT control stl_chemeleon_adaptivegnn_paper has a small trainable subset, so clip
#  was unnecessary, but scratch full-backbone requires grad clip as a standard safeguard.)

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: dmpnn
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone: !include _base/model/dmpnn_default.yaml
  fusion: null
  head:
    type: linear

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 15
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2
  kwargs:
    gradient_clip_val: 1.0

notes: |
  Divergence fix for stl_dmpnn_paper. lr/epochs/patience/bs/precision all identical,
  Only gradient_clip_val=1.0 added. Normal control for fair STL↔STL backbone comparison.
