name: stl_dmpnn_paper_gradclip
kind: train

# STL D-MPNN graph-only baseline (paper-faithful control), with gradient clipping.
# stl_dmpnn_paper_seed01234.yaml 은 lr=1e-3 flat schedule + no grad clip 으로
# full-backbone scratch D-MPNN 학습이 여러 task/seed 에서 발산(best_val=inf,
# Bioavailability_Ma AUROC 0.408 등) → TDC mean rank 18.45 의 broken control.
# 이 변형은 동일 프로토콜에 gradient_clip_val=1.0 만 추가해 발산을 막는다.
# (PEFT 대조군 stl_chemeleon_adaptivegnn_paper 는 trainable subset 이 작아 clip
#  불필요했으나, scratch full-backbone 은 표준 안전장치로 grad clip 필요.)

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: dmpnn
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone: !include _base/model/dmpnn_default.yaml
  fusion: null
  head:
    type: linear

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 15
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2
  kwargs:
    gradient_clip_val: 1.0

notes: |
  stl_dmpnn_paper 의 발산 수정본. lr/epochs/patience/bs/precision 모두 동일,
  gradient_clip_val=1.0 만 추가. fair STL↔STL backbone 비교용 정상 control.
