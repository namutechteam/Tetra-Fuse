name: mtl_molformer_robust_causal6_kendall
kind: train

# MoLFormer-LoRA uni-backbone + Kendall UW (mixed_task_uncertainty) + causal6.
#
# Counterpart with only the backbone of mtl_chemeleon_robust_causal6_kendall.yaml swapped to MoLFormer-LoRA.
# The molformer axis of the per-modality uni-backbone Kendall comparison set (ch / gm / um / mf).
# loss / head / dataset / trainer regime is identical to ch/gm (100ep, patience 15 — as trained).
#
# backbone kwargs are carried from mtl_molformer_lora_gradnorm_lastlinear_causal6.yaml.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # ← 6-group causal

features:
  graph: null
  descriptors: []
  embeddings: [molformer_tokens]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: molformer_lora
    consumes: [molformer_tokens]
    kwargs:
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4                 # ← identical to ch recipe (robust_causal6 carry)

loss:
  type: mixed_task_uncertainty     # Kendall UW
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100                   # as trained (run f6b3e3db0740); best epoch 2~5 observed
  patience: 15
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16                   # aligned with ch recipe axis (molformer is a free knob that can be increased)
  lr: 0.0005                       # constant LR (head / GroupedHead trunk / Kendall log_vars)
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005                 # MoLFormer LoRA q/v (keep separate lr)
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  MoLFormer-LoRA uni-backbone + Kendall UW + causal6 6-group.
  The molformer axis of the per-modality comparison set (mf among ch / gm / um / mf).

  Convergence/budget rationale:
    - mtl_molformer_lora_gradnorm_lastlinear_causal6 observed best epoch = 5/2/5/4/2
      (mean 3.6). Converges fastest among 4 modalities → tends to enter overfit immediately.
      head dropout 0.4 + early stopping is key (regularization matters more than budget). Actual training
      max_epochs 100 / patience 15 (early stopping cuts it off much earlier).
    - However, the above is a GradNorm/Noam run — this is Kendall/const-LR, so the convergence point may shift.

  ⚠ Requires MoLFormer 84M base ckpt (loaded internally by molformer_lora backbone).

  DDP (2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_molformer_robust_causal6_kendall.yaml \
      --devices 2 --strategy ddp
    - Kendall single backward + MoLFormer static forward → no extra flag needed
      (the gradnorm sibling also required no special DDP flags). If issues arise, use --find-unused-parameters.
