name: stl_graphmvp_adaptivegnn_paper
kind: train

# STL GraphMVP + AdapterGNN paper-faithful (Li et al., AAAI'24), seeds 0-4 변형.
# stl_chemeleon_adaptivegnn_paper_seed01234.yaml 와 동일한 STL paper 프로토콜
# (dataset tdc_admet_22 seeds 1-5 / trainer seeds 0-4 / 30ep / patience 5 /
#  32-true / bs 32 / lr 1e-3 / num_workers 2)로 맞춘 fair STL↔STL 비교용.
# 기존 stl_graphmvp_adaptivegnn_paper.yaml (seeds 1-5 / 100ep / patience 20) 대비
# trainer 프로토콜을 chemeleon/dmpnn seed01234 패밀리에 통일했다.
#
# 수렴 근거: graphmvp MTL kendall (mtl_graphmvp_robust_causal6_kendall) 은 20ep
#   에서 best epoch 8~15 로 수렴 → STL 30ep/patience 5 면 충분.
#   (혹시 adapter 학습 신호가 약해 과소적합 시 max_epochs 100 / patience 20 로 복귀.)
#
# MTL 대조: mtl_graphmvp_robust_causal6_kendall.yaml (run b6af07f65a7b).
#   MTL vs STL 외 차이: head grouped↔bottleneck / loss kendall(masked_mae)↔
#   single_task(masked_mse) / dataset causal6↔plain / use_edge_attr true↔미설정
#   (paper 모드에서 무시) / 20ep·bf16·bs16·lr5e-4 ↔ 30ep·32true·bs32·lr1e-3.

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: null
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: graphmvp
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_kind: paper          # AAAI'24 paper-faithful (default 이지만 명시)
      adapter_bottleneck: 64
      adapter_dropout: 0.0
      # use_edge_attr 는 paper 모드에서 무시 (frozen GIN 내부 edge_attr 는 그대로 사용)
      pool: mean
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 30
  patience: 5
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2

notes: |
  STL GraphMVP + AdapterGNN paper-faithful (r=64, 5-layer GIN frozen) — seeds 0-4
  fair-comparison 변형. train_stl 가 prepare_stl_graphmvp_loaders 경로로 처리
  (SMILES → PyG Batch, batch['graphmvp_data']).

  vs stl_graphmvp_adaptivegnn_paper.yaml: trainer seeds 1-5/100ep/patience 20 →
  0-4/30ep/patience 5 (chemeleon·dmpnn seed01234 패밀리 통일). backbone/head/loss 동일.
  ⚠ 가중치 필요 (data/weights/graphmvp/graphmvp_hybrid.pth — 없으면 random-init warning).
