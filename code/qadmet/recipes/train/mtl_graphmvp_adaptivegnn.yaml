name: mtl_graphmvp_adaptivegnn
kind: train

dataset: !include _base/dataset/tdc_admet_22_mech.yaml

features:
  graph: null
  descriptors: []
  embeddings: [graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: graphmvp
    consumes: [graphmvp_data]
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_bottleneck: 64
      adapter_dropout: 0.0
      use_edge_attr: true
      pool: mean
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss:
  type: mixed_task_gradnorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null            # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                    # restoring force (Chen 2018 ADMET asymmetric 권장)
    shared_layer: backbone
    #shared_layer: backbone.proj.0 # GraphMVP proj 의 첫 Linear (emb_dim→d_h). null/backbone 이면 auto-detect

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 4

notes: |
  단일 backbone MTL — GraphMVP (frozen 5-layer GIN + AdapterGIN trainable,
  adaptivegnn.md 2026-05-09 구현).

  Backbone:
    - graphmvp_hybrid.pth (regression variant) frozen, AdapterGINBlock 5개 (각 frozen GIN
      layer 사이) 만 학습. zero-init residual.
    - 보조 modality 없음, fusion 없음 → 단일 backbone 으로 GroupedHead 직결.
    - collate (``prepare_*_graphmvp_loaders``) 가 SMILES → PyG Batch 즉석 변환
      (LMDB precompute 불필요). invalid SMILES 는 1-atom placeholder + presence=False.

  Routing:
    - dataset = tdc_admet_22_mech (routing.md mechanism-aligned 7-group).
    - head.routing = taskset_grouping (코드 경로 게이트; 실제 grouping 은 TaskSet 의
      ADMET_7_GROUP_MECH).

  Loss / Optim:
    - mixed_task_gradnorm (bce + masked_mae + GradNorm dynamic task weighting).
      shared_layer=backbone (auto-detect → backbone.proj.0 = emb_dim→d_h Linear) 의
      ∥∇_W L_k∥ 로 각 task w_k 학습. α=1.5 (asymmetric). w 는 step 마다 sum=K 로
      renormalize. LitModule 가 manual optimization 모드로 L_main / L_grad 두 번 backward.
      DDP 시 --find-unused-parameters --no-ddp-static-graph 둘 다 필요.
    - LoRA 없음 → lr=1e-3 단일.

  비교 대상:
    - STL: stl_graphmvp_adaptivegnn.yaml (동일 backbone 설정, head=linear).
    - graphmvp 사이즈는 작아 (~374K trainable) → 학습 신호 약할 수 있음.
      stl 의 max_epochs=100, patience=20 결정 (2026-05-08) 을 그대로 계승.

  ⚠ 가중치 다운로드 필요 (data/weights/graphmvp/graphmvp_hybrid.pth — 없으면 random-init
  warning 후 smoke 모드).
