name: mtl_graphmvp_robust_causal6_kendall
kind: train

# GraphMVP uni-backbone (AdapterGNN) + Kendall UW (mixed_task_uncertainty) + causal6.
#
# mtl_chemeleon_robust_causal6_kendall.yaml paired recipe that replaces only the backbone with GraphMVP.
# The graphmvp axis of the per-modality uni-backbone Kendall comparison set (ch / gm / um / mf).
# loss / head / dataset / trainer regime is identical across the 4 recipes → "modality"-only ablation.
#
# backbone kwargs are carried over from mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6.yaml
# (adapter_kind=paper, bottleneck=64, GIN num_layer=5 / emb_dim=300 / JK=last).

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # ← 6-group causal

features:
  graph: null                     # GraphMVP uses its own graph featurizer (does not consume chemeleon graph)
  descriptors: []
  embeddings: [graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: graphmvp
    consumes: [graphmvp_data]
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_kind: paper          # AAAI'24 paper-faithful AdapterGNN
      adapter_bottleneck: 64       # ← same as graphmvp gradnorm causal6 (r tuned for 300d)
      adapter_dropout: 0.0
      use_edge_attr: true
      pool: mean
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping      # code gate — actual grouping is TaskSet.initial_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4                 # ← same as ch recipe (robust_causal6 carry)

loss:
  type: mixed_task_uncertainty     # Kendall UW
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null             # Kendall σ dynamically weights via log-var → inverse-freq prior off
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100                   # gm best epoch 8~15 (observed in mtl_graphmvp_adaptivegnn_gradnorm) → 20 is sufficient
  patience: 15
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16                   # aligned with ch recipe axis (graphmvp batch size is a free knob that can be increased)
  lr: 0.0005                       # constant LR (adapter + head + Kendall log_vars)
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  GraphMVP uni-backbone (AdapterGNN paper) + Kendall UW + causal6 6-group.
  per-modality comparison set: ch(chemeleon) / gm(graphmvp, this recipe) / um(unimol2) / mf(molformer).
  All four recipes share mixed_task_uncertainty + causal6 + bf16 / const-LR 5e-4 / batch 16 /
  head dropout 0.4 identical → backbone(modality)-only comparison.

  Backbone:
    - graphmvp_hybrid.pth GIN (num_layer=5, emb_dim=300, JK=last, mean pool) frozen.
    - adapter_kind="paper" AdapterGNN (r=64, γ init=0 → initially equivalent to frozen-only).

  Convergence/budget rationale:
    - mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6 observed best epoch = 8~15
      (mean 11.6) → 20ep + patience 5 is sufficient (however, that run used GradNorm/Noam, this one uses Kendall/const-LR
      → best epoch may shift somewhat).

  ⚠ Weights: data/weights/graphmvp/graphmvp_hybrid.pth (random-init warning if missing).

  DDP (2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_graphmvp_robust_causal6_kendall.yaml \
      --devices 2 --strategy ddp
    - Kendall single backward → usually no extra flags needed. However, the GradNorm sibling
      required --find-unused-parameters --no-ddp-static-graph on the GIN path, so
      add both flags if "unused parameters" / NCCL hang occurs.
