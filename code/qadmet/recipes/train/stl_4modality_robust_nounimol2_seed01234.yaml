name: stl_4modality_robust_nounimol2
kind: train

# MAP fusion (mtl_4modality_robust_causal6_nounimol2.yaml) 의 STL 대응물.
# === joint-fusion STL ===: 결과값 late-fusion 이 아니라, frozen backbone + PEFT
# (CheMeleon AdapterGNN / MoLFormer-LoRA / GraphMVP AdapterGNN) 3종을
# robust_attention 으로 joint fuse 한 동일 아키텍처를 task 마다 독립 학습한다
# (22 task × 5 seed = 110 모델, 각 모델이 3-modality fusion).
#
# MTL 대비 바뀐 것은 MTL→STL 4가지 뿐 (그 외 backbone/extra_backbones/fusion/
# trainer 는 부모 recipe 와 byte 단위 동일):
#   1) dataset      : tdc_admet_22_causal6 → tdc_admet_22 (STL 은 group routing 불필요)
#   2) model.type   : multitask → singletask
#   3) head         : grouped(taskset_grouping) → bottleneck (per-task 단일 출력)
#   4) loss         : mixed_task_uncertainty(Kendall) → single_task
#
# 동작 경로: train_stl 의 backbone_type=chemeleon 분기가 prepare_fold_loaders 로
# 전체 feature_spec (graph=chemeleon + embeddings=[molformer_tokens, graphmvp_data])
# 를 task 별로 collate 하고, _build_stl_lit_module 가 extra_backbones + fusion_spec
# 을 그대로 MultitaskLitModule(n_tasks=1) 에 전달 → 코드 변경 없이 joint fusion 학습.
# (molformer_tokens=token parquet, graphmvp_data=synthetic PyG, unimol2 없음 → LMDB 불요)

dataset: !include _base/dataset/tdc_admet_22.yaml      # ← causal6 아님 (STL)

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]
  missing_policy: mask_token

model:
  type: singletask                                     # ← MTL: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true
      warmup_epochs: 1
  head:
    type: bottleneck                                   # ← MTL: grouped/taskset_grouping

loss: !include _base/loss/single_task.yaml             # ← MTL: mixed_task_uncertainty

trainer:
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
  max_epochs: 100            # as trained (run a57008843b9b); base stl_lora says 20
  patience: 15               # as trained (run a57008843b9b); base stl_lora says 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  MAP fusion 의 STL 대응물 — joint 3-modality fusion (CheMeleon + MoLFormer-LoRA +
  GraphMVP) 을 per-task 로 학습. mtl_4modality_robust_causal6_nounimol2.yaml 와
  MTL↔STL 외 동일 (dataset/type/head/loss 4가지만 변경, trainer·fusion 동일).

  실행: STL 은 DDP 미지원 → 단일 GPU 단일 프로세스 (110 모델 순차).
    python -m qadmet.cli.main train --recipe recipes/train/stl_4modality_robust_nounimol2_seed01234.yaml
  ⚠ 가중치: chemeleon_mp.pt, graphmvp_hybrid.pth, MoLFormer 84M base 모두 필요.
