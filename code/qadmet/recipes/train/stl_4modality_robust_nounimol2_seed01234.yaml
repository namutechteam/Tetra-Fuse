name: stl_4modality_robust_nounimol2
kind: train

# STL counterpart of MAP fusion (mtl_4modality_robust_causal6_nounimol2.yaml).
# === joint-fusion STL ===: not late-fusion of results, but frozen backbone + PEFT
# (CheMeleon AdapterGNN / MoLFormer-LoRA / GraphMVP AdapterGNN) 3 types
# jointly fused via robust_attention; the same architecture is trained independently per task
# (22 tasks × 5 seeds = 110 models, each model a 3-modality fusion).
#
# Only 4 things changed from MTL→STL compared to MTL (otherwise backbone/extra_backbones/fusion/
# trainer are byte-identical to the parent recipe):
#   1) dataset      : tdc_admet_22_causal6 → tdc_admet_22 (STL does not need group routing)
#   2) model.type   : multitask → singletask
#   3) head         : grouped(taskset_grouping) → bottleneck (single output per task)
#   4) loss         : mixed_task_uncertainty(Kendall) → single_task
#
# Execution path: the backbone_type=chemeleon branch of train_stl passes via prepare_fold_loaders
# the full feature_spec (graph=chemeleon + embeddings=[molformer_tokens, graphmvp_data])
# collated per task, and _build_stl_lit_module passes extra_backbones + fusion_spec
# as-is to MultitaskLitModule(n_tasks=1) → joint fusion training with no code changes.
# (molformer_tokens=token parquet, graphmvp_data=synthetic PyG, no unimol2 → LMDB not needed)

dataset: !include _base/dataset/tdc_admet_22.yaml      # ← not causal6 (STL)

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]
  missing_policy: mask_token

model:
  type: singletask                                     # ← MTL: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.01
    kwargs:
      output_dim: 300
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 15
      modality_dropout: 0.2
      residual: true
      pre_norm: true
      warmup_epochs: 1
  head:
    type: bottleneck                                   # ← MTL: grouped/taskset_grouping

loss: !include _base/loss/single_task.yaml             # ← MTL: mixed_task_uncertainty

trainer:
  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
  max_epochs: 100            # as trained (run a57008843b9b); base stl_lora says 20
  patience: 15               # as trained (run a57008843b9b); base stl_lora says 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  lr_lora: 0.00005
  lr_fusion: 0.0001
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  STL counterpart of MAP fusion — joint 3-modality fusion (CheMeleon + MoLFormer-LoRA +
  GraphMVP) trained per-task. Compared to mtl_4modality_robust_causal6_nounimol2.yaml,
  identical except MTL↔STL (only 4 things changed: dataset/type/head/loss; trainer·fusion identical).

  Execution: STL does not support DDP → single GPU single process (110 models sequentially).
    python -m qadmet.cli.main train --recipe recipes/train/stl_4modality_robust_nounimol2_seed01234.yaml
  ⚠ Weights: chemeleon_mp.pt, graphmvp_hybrid.pth, MoLFormer 84M base all required.
