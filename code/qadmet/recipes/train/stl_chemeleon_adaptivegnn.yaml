name: stl_chemeleon_adaptivegnn
kind: train

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_bottleneck: 256
      n_adapter_layers: 2
      adapter_dropout: 0.0
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [1, 2, 3, 4, 5]
  max_epochs: 30
  patience: 5
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2

notes: |
  STL CheMeleon (frozen BondMessagePassing+MeanAggregation + AdaptorGNN trainable).
  4-modality MTL recipe (mtl_chemeleon_molformer_unimol2_graphmvp.yaml) 와 동일 backbone
  설정 (d_h=2048, d_xd=0, descriptors 미사용) → MTL ↔ STL fair 비교용.

  AdaptorGNN(Linear 2048→2048 + ReLU) + linear head 만 학습되므로 LoRA lr 분리 불필요
  (lr=1e-3 단일).

  loader 경로: chemeleon 은 chemprop ``MPNN.fingerprint`` 인터페이스를 그대로 사용 →
  train_stl 가 dmpnn 과 동일한 prepare_fold_loaders 경로로 처리.
