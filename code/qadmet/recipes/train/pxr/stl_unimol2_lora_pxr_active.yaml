name: stl_unimol2_lora_pxr_active
kind: train

dataset:
  name: pxr_pec50_only_active
  split: active_cluster_5seed
  seeds: [1, 2, 3, 4, 5]
  kwargs:
    lmdb_path: data/embeddings/pxr_unimol2_features.lmdb

features:
  graph: null
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: unimol2_lora
    kwargs:
      ckpt_path: data/weights/unimol2_84m/modelzoo/84M/checkpoint.pt
      model_size: 84m
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  fusion: null
  head:
    type: bottleneck

loss: !include ../../_base/loss/single_task.yaml

trainer:
  seeds: [1, 2, 3, 4, 5]
  max_epochs: 20
  patience: 5
  precision: 32-true
  early_stopping: true
  batch_size: 16
  lr: 0.001
  lr_lora: 0.00005
  num_workers: 2
