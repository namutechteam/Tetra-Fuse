name: mtl_dmpnn_rdkit_pxr_4task
kind: train

dataset: !include ../../_base/dataset/pxr_4task_scaffold.yaml

features:
  graph: dmpnn
  descriptors: [rdkit2d]
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include ../../_base/model/dmpnn_default.yaml
  head:
    type: grouped
    routing: taskset_grouping   # routing 게이트 — 실제 grouping 은 task_set initial_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include ../../_base/loss/mixed_kendall.yaml

trainer: !include ../../_base/trainer/default.yaml

notes: |
  PXR 4-task MTL: PXR_pEC50(primary) + PXR_Emax + PXR_selectivity + PXR_null_pEC50.
  Selectivity 가 batch-free GT 로 작용하므로 정규화 효과 기대.
  null_safe masked_mae 가 selectivity/null_pEC50 의 ~36% NaN 처리.
