name: mtl_dmpnn_rdkit_pxr_4task_active
kind: train

dataset: !include ../../_base/dataset/pxr_4task_active.yaml

features:
  graph: dmpnn
  descriptors: [rdkit2d]
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include ../../_base/model/dmpnn_default.yaml
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include ../../_base/loss/mixed_kendall.yaml

trainer: !include ../../_base/trainer/default.yaml

notes: |
  PXR 4-task MTL — active-cluster split.
