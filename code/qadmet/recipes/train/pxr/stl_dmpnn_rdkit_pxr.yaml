name: stl_dmpnn_rdkit_pxr
kind: train

dataset: !include ../../_base/dataset/pxr_pec50_scaffold.yaml

features:
  graph: dmpnn
  descriptors: [rdkit2d]
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone: !include ../../_base/model/dmpnn_default.yaml
  head:
    type: linear

loss: !include ../../_base/loss/single_task.yaml

trainer: !include ../../_base/trainer/default.yaml

notes: |
  PXR STL: D-MPNN(300) + RDKit2D(200) → linear head. 단일 target = PXR_pEC50 (batch-004 centered).
