name: mtl_chemeleon_adaptivegnn_kendall_pcgrad_scopeall
kind: train

dataset: !include _base/dataset/tdc_admet_22_mech.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_bottleneck: 256
      n_adapter_layers: 2
      adapter_dropout: 0.0
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss:
  type: mixed_task_uncertainty_pcgrad
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false
    pcgrad_scope: all              # head 포함 전체 trainable params 에 PCGrad
    pcgrad_eps: 1.0e-12

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 4

notes: |
  진단 변경 (b3e825 PCGrad trunk-scope 정체 후속):
    1) pcgrad_scope=all  — head 포함 전체 trainable params 에 PCGrad projection.
       trunk-only scope 의 비대칭 (trunk gradient 만 약화, head 는 일반 backward)
       이 trunk 학습 정체의 한 원인 가설 → 전 영역에 동일 처리.
    2) Single-GPU 실행 (torchrun 미사용) — DDP rank-local projection + all_reduce
       에서 batch 차이로 인한 magnitude noise 제거. 정통 PCGrad 거동 확인.

  비교 대상:
    - 2da91035e0a7 (Kendall only)        — sigma 학습됨 (mean=0.723).
    - f51fffae01e5 (GradNorm only)        — dynamic w 학습.
    - b3e825f20ed5 (K+PCGrad scope=trunk) — sigma 잠김 (mean=1.013), train_loss 정체.
