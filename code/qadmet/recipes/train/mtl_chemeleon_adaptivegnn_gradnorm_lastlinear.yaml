name: mtl_chemeleon_adaptivegnn_gradnorm_lastlinear
kind: train

# mtl_chemeleon_adaptivegnn 의 GradNorm scope ablation 분기:
#   - shared_layer: backbone (전체 chemeleon trainable param) → backbone.proj.0
#     (마지막 trainable Linear, CHEMELEON_HIDDEN+d_xd → d_h. Chen 2018 표준 proxy)
#   - 그 외 (routing=taskset_grouping, head=grouped, α=1.5, lr=1e-3, batch=32,
#     precision=32-true) 는 mtl_chemeleon_adaptivegnn 그대로 carry over.
#
# 목적:
#   원논문 GradNorm 은 last shared layer 의 ||∇W L_k|| 만 사용하는 proxy 방식인데
#   현재 default 는 backbone 전체 trainable param 으로 펼쳐있다. 이게 성능에 본질적인지
#   아니면 단순 GradNorm balancing 효과인지 확인. 동등하다면 step 당 autograd 비용이
#   크게 줄어든다 (per-task ∥∇W L_k∥ 호출이 single tensor 로 줄어듦).

dataset: !include _base/dataset/tdc_admet_22_mech.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_bottleneck: 256
      n_adapter_layers: 2
      adapter_dropout: 0.0
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss:
  type: mixed_task_gradnorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null            # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                    # restoring force (Chen 2018 ADMET asymmetric 권장)
    shared_layer: backbone.proj.0 # CheMeleon post-pool Linear (CHEMELEON_HIDDEN+d_xd → d_h).
                                  # resolver 가 nn.Linear → .weight 만 추출 → 단일 W
                                  # 텐서로 per-task ∥∇W L_k∥ 측정 (Chen 2018 표준).

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 4

notes: |
  mtl_chemeleon_adaptivegnn 의 GradNorm scope ablation 분기. 단일 backbone 구조
  (chemeleon frozen + AdapterGIN trainable + proj Linear) + 7-group routing 동일.

  Scope 차이:
    - default (mtl_chemeleon_adaptivegnn): shared_layer=backbone → adapter_blocks +
      proj 의 모든 trainable param 으로 ∥∇W L_k∥ 측정.
    - 본 recipe: shared_layer=backbone.proj.0 → proj 의 첫 Linear weight 만 사용.
      Chen 2018 원논문 proxy 와 동일 (last shared linear before per-task split).

  기대:
    - 성능 동등 → backbone-wide gradnorm 은 compute overhead 만 늘리는 sufficient
      but unnecessary 조건. 후속 unimol2 등 다른 backbone 도 last-linear scope 로
      통일.
    - 성능 하락 → adapter_blocks 내부까지 task imbalance signal 이 누적되어야 의미가
      있음. 그 경우 왜 그런지 (deep layer 의 task-specific drift?) 추가 분석 필요.

  비교 대상:
    - default scope: mtl_chemeleon_adaptivegnn (shared_layer=backbone).
    - kendall+pcgrad: mtl_chemeleon_adaptivegnn_kendall_pcgrad / _scopeall.
