name: stl_chemeleon_adaptivegnn_paper
kind: train

# STL paper-faithful AdapterGNN (Li et al., AAAI'24):
#   - adapter_kind="paper" → chemprop depth=3 의 (depth-1)=2 iteration 마다
#     pre/post AdapterGNNBlock 쌍 (bond-level, d=2048, r=128). 총 4 adapter.
#   - Eq.(7) A(x) = BN(W_up(ReLU(W_down(x)))), Eq.(8) parallel wiring.
#   → docs/sessions/2026-05-20_adaptergnn_paper_faithful_rewrite.md

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_kind: paper          # AAAI'24 paper-faithful (default 이지만 명시)
      adapter_bottleneck: 128
      adapter_dropout: 0.0
      # n_adapter_layers 는 paper 모드에서 무시 (depth-1 = 2 자동 결정)
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]      # TDC fold seeds actually used (manifest trainer.seeds)
  max_epochs: 100            # as trained (run 641681c81003); base stl_lora says 30
  patience: 15               # as trained (run 641681c81003); base stl_lora says 5
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2

notes: |
  STL CheMeleon + AdapterGNN paper-faithful (Li et al., AAAI'24).
  stl_chemeleon_adaptivegnn.yaml (legacy outer-only LoRA-GIN 시절 hyperparam
  유지: r=256, n_layers=2) 와의 차이점만 명시:

  Backbone:
    - chemeleon_mp.pt frozen (BondMessagePassing + MeanAggregation).
    - adapter_kind="paper": chemprop depth=3 의 (depth-1)=2 iteration 마다
      pre/post AdapterGNNBlock 쌍 (bond-level, d=2048, r=128). 총 4 adapter.
      각 block = down → ReLU → up → BN → γ·scale (γ init=0)
      → dropout → delta (NO internal residual). caller 가 frozen path 와 합산.
    - parallel wiring (Eq.8): H_l = frozen_update(M, H_0) + s1·A1(H) + s2·A2(M).
      여기서 M = mp.message(H, bmg) (= MP(x_l)), frozen_update = BN(MLP(MP))
      자리 (chemprop 의 W_h(M)+H_0 → tau 경로가 paper 의 outer BN(MLP) 역할).
    - γ=0 초기엔 frozen-only baseline 과 비트 단위 동등 (smoke test 검증).
    - trainable post-pool Linear self.proj[0] (CHEMELEON_HIDDEN → d_h=2048).

  vs legacy stl_chemeleon_adaptivegnn.yaml:
    - 명시적으로 adapter_kind="paper" (legacy 도 default 가 paper 라 동일 동작
      이었으나, 본 recipe 는 의도 분명히 함 + n_adapter_layers 제거).
    - adapter_bottleneck 256 → 128 (mtl_chemeleon_adaptivegnn_gradnorm_lastlinear_causal6
      과 동일). bond-level d=2048 기준 r=128 은 ~0.26M params/adapter ×4 = ~1M
      trainable (proj 제외) → 더 가벼운 PEFT.

  Loss / Optim:
    - single_task (loss/_base/single_task.yaml): regression=masked_mae,
      classification=bce_with_logits, STL 이므로 task weighting 무관.
    - AdapterGNN paper-faithful + linear head 만 학습되므로 LoRA lr 분리
      불필요 (lr=1e-3 단일).

  비교 대상:
    - stl_chemeleon_adaptivegnn.yaml (동일 paper 모드 default 지만 r=256).
    - MTL paper-faithful: mtl_chemeleon_adaptivegnn_gradnorm_lastlinear_causal6.yaml
      (동일 backbone/r=128, head=grouped, loss=mixed_task_gradnorm) → MTL ↔ STL
      fair 비교용.

  loader 경로: chemeleon 은 chemprop ``MPNN.fingerprint`` 인터페이스를 그대로 사용 →
  train_stl 가 dmpnn 과 동일한 prepare_fold_loaders 경로로 처리.
