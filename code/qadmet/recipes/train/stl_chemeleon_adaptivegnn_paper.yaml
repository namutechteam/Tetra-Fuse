name: stl_chemeleon_adaptivegnn_paper
kind: train

# STL paper-faithful AdapterGNN (Li et al., AAAI'24):
#   - adapter_kind="paper" → every (depth-1)=2 iterations of chemprop depth=3
#     pre/post AdapterGNNBlock pair (bond-level, d=2048, r=128). 4 adapters total.
#   - Eq.(7) A(x) = BN(W_up(ReLU(W_down(x)))), Eq.(8) parallel wiring.
#   → docs/sessions/2026-05-20_adaptergnn_paper_faithful_rewrite.md

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_kind: paper          # AAAI'24 paper-faithful (default, but stated explicitly)
      adapter_bottleneck: 128
      adapter_dropout: 0.0
      # n_adapter_layers is ignored in paper mode (depth-1 = 2 determined automatically)
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]      # TDC fold seeds actually used (manifest trainer.seeds)
  max_epochs: 100            # as trained (run 641681c81003); base stl_lora says 30
  patience: 15               # as trained (run 641681c81003); base stl_lora says 5
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001
  num_workers: 2

notes: |
  STL CheMeleon + AdapterGNN paper-faithful (Li et al., AAAI'24).
  stl_chemeleon_adaptivegnn.yaml (legacy outer-only LoRA-GIN era hyperparam
  kept: r=256, n_layers=2) — only the differences from this are stated:

  Backbone:
    - chemeleon_mp.pt frozen (BondMessagePassing + MeanAggregation).
    - adapter_kind="paper": every (depth-1)=2 iteration of chemprop depth=3
      pre/post AdapterGNNBlock pair (bond-level, d=2048, r=128). 4 adapters total.
      each block = down → ReLU → up → BN → γ·scale (γ init=0)
      → dropout → delta (NO internal residual). the caller adds this to the frozen path.
    - parallel wiring (Eq.8): H_l = frozen_update(M, H_0) + s1·A1(H) + s2·A2(M).
      here M = mp.message(H, bmg) (= MP(x_l)), frozen_update = BN(MLP(MP))
      position (chemprop's W_h(M)+H_0 → tau path plays the role of the paper's outer BN(MLP)).
    - at γ=0 init, bit-exact equivalent to the frozen-only baseline (verified by smoke test).
    - trainable post-pool Linear self.proj[0] (CHEMELEON_HIDDEN → d_h=2048).

  vs legacy stl_chemeleon_adaptivegnn.yaml:
    - explicitly adapter_kind="paper" (legacy also defaults to paper so behavior is identical
      but this recipe makes the intent explicit + removes n_adapter_layers).
    - adapter_bottleneck 256 → 128 (mtl_chemeleon_adaptivegnn_gradnorm_lastlinear_causal6
      same as). based on bond-level d=2048, r=128 is ~0.26M params/adapter ×4 = ~1M
      trainable (excluding proj) → lighter PEFT.

  Loss / Optim:
    - single_task (loss/_base/single_task.yaml): regression=masked_mae,
      classification=bce_with_logits, task weighting is irrelevant since this is STL.
    - since only AdapterGNN paper-faithful + linear head are trained, separate LoRA lr
      is unnecessary (single lr=1e-3).

  comparison target:
    - stl_chemeleon_adaptivegnn.yaml (same paper mode default but r=256).
    - MTL paper-faithful: mtl_chemeleon_adaptivegnn_gradnorm_lastlinear_causal6.yaml
      (same backbone/r=128, head=grouped, loss=mixed_task_gradnorm) → MTL ↔ STL
      for a fair comparison.

  loader path: chemeleon uses the chemprop ``MPNN.fingerprint`` interface as-is →
  train_stl is processed through the same prepare_fold_loaders path as dmpnn.
