name: mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6
kind: train

# mtl_chemeleon_film_aux_gradnorm 의 primary swap 분기 (2026-05-21):
#   - primary: CheMeleon → GraphMVP_hybrid (frozen GIN, num_layer=5, emb_dim=300).
#     CheMeleon 은 보조 modality 로 강등 (extra_backbones[0]).
#   - dataset: tdc_admet_22_mech → tdc_admet_22_causal6 (6-group causal chain).
#   - AdapterGNN paper-faithful (adapter_kind="paper") 를 graphmvp/chemeleon 양쪽에 적용
#     → docs/sessions/2026-05-20_adaptergnn_paper_faithful_rewrite.md
#   - FilmFusion 에 post-fusion output_proj Linear (768→768) 추가 (use_output_proj=true,
#     identity-init). fused z 위에 직접 작용하는 단일 W tensor 가 생기면서 GradNorm
#     shared_layer 가 진짜 "fused multimodal signal 의 last shared Linear" 가 됨.
#     기존 FiLM 후보 (primary_proj=primary only, film_gen.2=warmup frozen + cache 잠금,
#     fusion 전체=cache 가 film_gen 영원 제외) 의 한계 모두 해소.
#   - GradNorm: shared_layer=fusion.output_proj + w_k clamp [0.3, 3.0] 자동 적용
#     (lit_module._gradnorm_training_step).
#     → docs/sessions/2026-05-20_gradnorm_review_resume_fix.md
#     → docs/sessions/2026-05-20_causal6_grouping.md
#
# 4-modality 구성 (GraphMVP main + CheMeleon/MoLFormer/UniMol2 aux):
#   - 보조 modality 가 primary 표현을 affine 변조 (z = γ⊙x + β + x).
#   - identity-init: γ_pre=0, β=0 시작 → epoch 0 에서 z = 2x.
#   - warmup 15 epoch: film_gen freeze + (γ=1, β=0) → GraphMVP 단독 학습으로 시작.
#   - hyperparam (lr 5e-4, lr_lora 3e-5, lr_fusion 5e-5, bf16-mixed, batch 16) 은
#     mtl_chemeleon_film_aux_gradnorm 에서 carry over (fair compare).

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml

features:
  graph: chemeleon                       # aux CheMeleon 의 bmg 입력용
  descriptors: []
  embeddings: [graphmvp_data, molformer_tokens, unimol2_lmdb]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: graphmvp
    consumes: [graphmvp_data]
    kwargs:
      d_h: 300
      checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
      num_layer: 5
      emb_dim: 300
      JK: last
      adapter_kind: paper                # AAAI'24 paper-faithful
      adapter_bottleneck: 64
      adapter_dropout: 0.0
      use_edge_attr: true
      pool: mean
  extra_backbones:
    - type: chemeleon
      kwargs:
        d_h: 2048
        checkpoint_path: data/weights/chemeleon_mp.pt
        d_xd: 0
        adapter_kind: paper              # AAAI'24 paper-faithful
        adapter_bottleneck: 128
        adapter_dropout: 0.0
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
  fusion:
    type: film
    entropy_weight: 0.0                  # FiLM 은 attention 아님 — entropy reg 미사용
    kwargs:
      output_dim: 768                    # primary projection 차원 (head 입력 차원)
      cond_hidden: 256                   # 보조 condition projection 차원 (3×256=768 concat)
      condition_dropout: 0.15            # 학습 중 보조 condition 의 sample-wise zero-out
      residual: true                     # z = γ⊙x + β + x
      pre_norm: true                     # GraphMVP 300 vs aux 2048/768/768 scale 흡수
      film_init_identity: true           # γ_pre=0, β=0 시작 → identity modulation
      warmup_epochs: 15                  # 처음 15 epoch 은 GraphMVP 단독 학습
      use_output_proj: true              # fused z 위에 post-fusion Linear (768→768).
                                         # identity-init (W=I, b=0) → 활성화 시점 forward
                                         # 출력은 비활성 때와 동일. GradNorm shared_layer
                                         # 후보 — 모든 22 task forward 통과 + 항상 trainable.
  head:
    type: grouped
    routing: taskset_grouping               # 코드 경로 게이트만 — 실제 grouping 은
                                         # task_set.initial_grouping (6-group) 에서 옴
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_gradnorm
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null                   # GradNorm 동적 학습 → uniform 강제
  kwargs:
    alpha: 1.5                           # restoring force (Chen 2018 ADMET asymmetric)
    shared_layer: fusion.output_proj     # post-fusion Linear (768→768). z = γ⊙x + β + x
                                         # → output_proj(z) — fused multimodal signal 을
                                         # forward 에서 직접 처리하는 단일 W tensor.
                                         # 모든 22 task 의 prediction 이 통과 (head 가
                                         # group 별 trunk 로 분기되기 직전 last shared
                                         # Linear). 항상 trainable (warmup 영향 없음) →
                                         # GradNorm resolver cache 잠금 이슈도 회피.
                                         # ∇W_op L_k = ∂L_k/∂z' · z^T 로 task-difficulty
                                         # proxy 가 fused signal 위에서 측정됨.
                                         # w_k clamp [0.3, 3.0] 는 lit_module 에서 자동 적용.

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 40                           # warmup_epochs(15) 동안 best val_loss 가 일찍 잡혀도
                                         # post-warmup 충분히 학습되도록 (epoch ~42 까지 보장).
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005                             # 1e-3 → 5e-4 (v2 캐리)
  lr_lora: 0.00003                       # 5e-5 → 3e-5
  lr_fusion: 0.00005                     # FiLM gen + projections (gate slowdown)
  num_workers: 4
  # GradNorm = manual optimization → Lightning 의 accumulate_grad_batches /
  # gradient_clip_val 모두 비호환 (configuration_validator 가 raise).
  # 원본 v2 처방의 effective batch 32 는 DDP 2-rank × per-GPU batch 16 으로 보전.

notes: |
  GraphMVP main + (CheMeleon / MoLFormer / UniMol2) FiLM 변조.
  chemeleon_film_aux_gradnorm 의 primary swap + causal6 routing + adapter paper-faithful
  3-way ablation. CheMeleon 은 보조 modality 로 강등.

  Backbone:
    - primary = GraphMVP_hybrid (regression variant) frozen GIN, num_layer=5,
      emb_dim=300, AdapterGNN paper-faithful (adapter_kind="paper", r=64).
      각 layer 마다 pre/post AdapterGNNBlock 쌍 (총 5+5=10 adapter, γ=0 init).
      post-pool self.proj[0] (Linear 300→300) + ReLU 도 trainable.
    - aux[0] = CheMeleon (frozen + AdapterGNN paper-faithful, r=128). features.graph
      경유 (consumes 없음, batch["bmg"] 직접 읽음). chemeleon_adaptivegnn_gradnorm_
      lastlinear_causal6_wclamp 와 동일 backbone 설정.
    - aux[1] = MoLFormer-XL + LoRA (q/v rank=16, α=32, dropout=0.1).
    - aux[2] = UniMol2 84M + LoRA (linear_q/linear_v rank=16, α=32, dropout=0.1).

  Fusion (FiLM):
    - x = primary_proj(H_graphmvp 300d) → 768d
    - γ,β = MLP(concat(cond_proj_chem(H_chem 2048d),
                       cond_proj_mol(H_molformer 768d),
                       cond_proj_uni(H_unimol2 768d))) ∈ R^{768}
    - z = γ⊙x + β + x  (residual)
    - z = output_proj(z)               ← post-fusion Linear (768→768, identity-init)
                                          GradNorm shared_layer.
    - identity init (γ_pre=0, β=0, output_proj=I) + warmup 15 epoch → 초기에는
      GraphMVP 단독 (forward 출력 동일, output_proj 만 gradient 흘림).

  Routing:
    - dataset = tdc_admet_22_causal6 (6-group causal chain).
    - 그룹 (총 22 task): oral_uptake(4) / distribution_cns(4) /
      interaction_liabilities(5) / metabolic_turnover(5) / distal_safety(3) /
      composite_exposure(1).
    - head.routing = taskset_grouping 은 코드 경로 게이트일 뿐, 실제 grouping 은
      TaskSet.initial_grouping = ADMET_6_GROUP_CAUSAL 에서 옴.

  Loss / Optim:
    - mixed_task_gradnorm (bce + masked_mae + GradNorm dynamic task weighting).
      shared_layer=fusion.output_proj → fused z 위에 직접 작용하는 post-fusion
      Linear (768→768, 590K params) 의 ∥∇W L_k∥ 측정. 모든 22 task 의 forward 가
      fused multimodal z 를 거쳐 output_proj 를 통과 → head 가 group 별로 분기
      되기 직전 last shared Linear. ∇W_op L_k = ∂L_k/∂z' · z^T 로 task-difficulty
      proxy 가 fused signal 위에서 측정. α=1.5 (ADMET asymmetric). w 는 step 마다
      sum=K=22 로 renormalize. w_k ∈ [0.3, 3.0] hard bound (lit_module 자동 적용).
      LitModule 가 manual optimization 모드로 두 step (L_main / L_grad) backward.
    - FiLM 후보 비교 (왜 output_proj 인가):
        · fusion.primary_proj: forward 가 primary only (aux 정보 없음), backward
          만 (γ+1) 로 aux-modulated. proxy 가 primary 편향.
        · fusion.film_gen.2: warmup 동안 frozen → resolver 가 trainable=[]
          반환 → ValueError 크래시. identity init 으로 ∇W 가 epoch 0 부근 ~0.
        · fusion (모듈 전체): resolver cache 가 epoch 0 trainable subset 으로
          영구 잠금 → film_gen 영원히 제외. 사실상 primary_proj+cond_projs.
        · fusion.output_proj (본 recipe): fused z 를 forward 에서 직접 처리,
          항상 trainable (warmup 영향 없음, cache 잠금 안전), single W tensor.
    - FiLM warmup 15 epoch 동안 film_gen frozen — output_proj 는 영향 없음 (별도
      모듈, 항상 trainable). identity-init 이라 활성화 시점 forward 출력이 비활성
      과 동일 → 기존 FiLM 동작 보존 + GradNorm proxy 만 추가됨.
    - lr=5e-4 / lr_lora=3e-5 / lr_fusion=5e-5 분리.
    - precision=bf16-mixed, batch_size=16. accumulate_grad_batches / gradient_clip_val
      은 GradNorm manual optimization 비호환이라 제거. effective batch 32 는
      DDP 2-rank × per-GPU 16 으로 보존.

  비교 대상:
    - 동일 fusion + CheMeleon primary + mech routing: mtl_chemeleon_film_aux_gradnorm.
    - 동일 routing + GraphMVP 단일 backbone: mtl_graphmvp_adaptivegnn_gradnorm_lastlinear_causal6.
    - 동일 routing + CheMeleon 단일 backbone:
      mtl_chemeleon_adaptivegnn_gradnorm_lastlinear_causal6_wclamp.
    - 동일 routing + MoLFormer 단일 backbone:
      mtl_molformer_lora_gradnorm_lastlinear_causal6.
    - 동일 routing + UniMol2 단일 backbone:
      mtl_unimol2_lora_gradnorm_lastlinear_causal6.

  ⚠ 가중치 다운로드 필요:
    - data/weights/graphmvp/graphmvp_hybrid.pth (primary, 없으면 random-init warning)
    - data/weights/chemeleon_mp.pt (aux)
    - MoLFormer / UniMol2 84M ckpt (각 LoRA base)

  DDP 권장 옵션:
    - torchrun --nproc_per_node=2 -m qadmet.cli.main train \
        --recipe recipes/train/mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6.yaml \
        --devices 2 --strategy ddp \
        --find-unused-parameters --no-ddp-static-graph
    - find-unused-parameters: GradNorm manual_opt + FiLM warmup 경계에서
      trainable subset 변동.
    - no-ddp-static-graph:
        (1) UniMol2 LoRA recipe 은 static_graph 비호환 (reducer.cpp:1603 폭발).
        (2) warmup_epochs(15) 경계에서 film_gen 의 requires_grad 가 False→True 로
            전환되므로 static graph 가정이 깨짐.

  기대 시그널:
    - GraphMVP primary 의 작은 d_h (=300) 가 FiLM primary_proj 768d 로 expand 되면서
      CheMeleon 2048d aux 의 affine 변조 신호를 효과적으로 흡수하는지.
    - chemeleon_film_aux_gradnorm (CheMeleon primary, mech routing) 대비:
        · routing 효과: causal6 vs mech (Sol·Lipo 재배치 + Half_Life singleton).
        · primary swap 효과: GraphMVP (smaller, frozen + paper adapter) 가 main
          으로서 CheMeleon (larger) 을 cond 로 받는 reverse 구조의 우열.
    - gradnorm_w/<task> 곡선이 [0.3, 3.0] hard cap 안에서 안정적인지.
