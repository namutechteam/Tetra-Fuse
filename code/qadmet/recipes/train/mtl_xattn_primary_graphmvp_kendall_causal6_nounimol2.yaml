name: mtl_xattn_primary_graphmvp_kendall_causal6_nounimol2
kind: train

# Asymmetric primary(query) + cross-attention 주입 fusion — primary ablation 2/3.
#
# multi_film 의 대칭(K개 primary) 융합이 robust/GR-MF(asymmetric) 에 밀린 뒤 채택한
# 재설계. primary 1개를 query, 나머지 aux 를 key/value 로 두고 TransformerDecoder 로
# cross-modal 정보 주입 (내장 residual 이 primary 보존 → washout 차단). 순수
# cross-attention (FiLM 미사용). 문헌: MuMo(arXiv:2510.23640) asymmetric injection.
#
# 본 recipe: primary = GraphMVP(300d 3D-graph) (primary_idx=2).
# backbone 구성(chemeleon backbone + molformer_lora + graphmvp extras)은 3 ablation
# 모두 동일 — fusion.kwargs.primary_idx 만 0/1/2 로 바꿔 query stream 선택.
#   embeddings 순서 = [chemeleon(0), molformer(1), graphmvp(2)].

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # 6-group causal

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]   # UniMol2 제외 → 3-modality
  missing_policy: mask_token

model:
  type: multitask
  backbone:                                  # embeddings[0]
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:                           # embeddings[1], embeddings[2]
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: cross_attention
    entropy_weight: 0.0                       # cross-attn weight 미노출 — entropy reg 미사용
    kwargs:
      output_dim: 300                         # 300 % num_heads(4) == 0
      primary_idx: 2                      # query stream = GraphMVP(300d 3D-graph)
      num_layers: 1                            # 작게 시작 (작은 TDC task overfit 방어)
      num_heads: 4
      ffn_mult: 4
      dropout: 0.1
      modality_dropout: 0.2                    # aux token sample-wise mask (robust/film 정렬)
      pre_norm: true                           # 2048/768/300 scale 비대칭 흡수
      warmup_epochs: 1                          # decoder freeze → primary 단독 1 epoch
      use_output_proj: true                     # post-fusion Linear (300→300, identity-init)
  head:
    type: grouped                               # cross_attention 은 (B, D) 출력
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty                 # Kendall UW
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 20
  patience: 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0                             # constant LR
  lr_lora: 0.00005
  lr_fusion: 0.0001                            # fusion(decoder) 별도 lr
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  Asymmetric primary(query)=GraphMVP(300d 3D-graph) + aux(key/value) cross-attention 주입.
  UniMol2 제외 3-modality (CheMeleon/MoLFormer-LoRA/GraphMVP). primary 를
  TransformerDecoder(self-attn + cross-attn(primary→aux) + FFN)로 aux 에서 content-
  dependent 하게 enrich. 내장 residual 이 primary 보존 → washout 구조적 차단.

  primary ablation 짝 (2/3): mtl_xattn_primary_chemeleon/molformer/graphmvp_*.
  비교: robust_attention nounimol2(8.55) / GR-MF nounimol2(9.18) / multi_film(9.50) /
        chemeleon-only(9.45).

  ⚠ 가중치: chemeleon_mp.pt, graphmvp_hybrid.pth, MoLFormer 84M ckpt(LoRA base).

  DDP (2-GPU):
    torchrun --nproc_per_node=2 --master_port=29556 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_xattn_primary_graphmvp_kendall_causal6_nounimol2.yaml \
      --devices 2 --strategy ddp --find-unused-parameters --no-ddp-static-graph
    - find-unused-parameters / no-ddp-static-graph: warmup(epoch0→1) decoder/aux_proj
      requires_grad 토글로 trainable subset 변동 방어.
