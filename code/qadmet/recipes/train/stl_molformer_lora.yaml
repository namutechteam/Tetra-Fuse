name: stl_molformer_lora
kind: train

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: null
  descriptors: []
  embeddings: []
  missing_policy: mask_token

model:
  type: singletask
  backbone:
    type: molformer_lora
    kwargs:
      lora_rank: 16
      lora_alpha: 32
      lora_dropout: 0.1
  fusion: null
  head:
    type: bottleneck

loss: !include _base/loss/single_task.yaml

trainer: !include _base/trainer/stl_lora.yaml

notes: |
  Legacy phase4 STL MoLFormer-XL + LoRA (q/v rank=16) equivalent.
  Training input: precomputed token_ids/attention_mask (molformer_tokens.parquet, MAX_LEN=202).
  No auxiliary modality (LoRA only). Per MEMORY's "LoRA-first" policy, item prioritizing correct behavior.
  From Step 3.6c onward: trainer.lr_lora=5e-5 / lr=1e-3 applied separately (equivalent to legacy run_stl_molformer_lora).
