name: mtl_4modality_v3_capacity_min
kind: train

# v3 — v2 reg_strong 그대로 + capacity 곱곱 축소.
# v2 5-seed 결과 (W/L/T 15/7/0 vs σ freeze only): 작은 task 우세, 큰 task (CYP/Lipo)
# 손해. v3 가설: head input/trunk capacity 더 좁히면 작은 task 추가 개선 + 큰 task
# 손해 미미? 아니면 head 너무 작아 큰 task 도 망가지는지 검증.
#
# 변경 (vs v2):
#   trunk_hidden     128  → 64   (head trunk param 1/2)
#   fusion output_dim 768 → 256  (head input 1/3 → trunk linear 1/3, 합쳐 1/6 head param)
#   head dropout     0.4  → 0.5  (살짝 더)
# 그 외 (lr 5e-4, lr_lora 3e-5, lr_fusion 5e-5, fusion warmup 15, entropy 0.05,
# modality_dropout 0.25, tau 3.0, σ freeze, per-group WD) 모두 v2 그대로.

dataset: !include _base/dataset/tdc_admet_22.yaml

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, unimol2_lmdb, graphmvp_data]
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: unimol2_lora
      consumes: [unimol2_lmdb]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: robust_attention
    entropy_weight: 0.05
    kwargs:
      output_dim: 256          # 768 → 256 (head input 1/3)
      tau_init: 3.0
      tau_min: 0.5
      anneal_epochs: 50
      modality_dropout: 0.25
      residual: true
      pre_norm: true
      warmup_epochs: 15
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 64          # 128 → 64
      dropout: 0.5              # 0.4 → 0.5

loss:
  type: mixed_task_uncertainty
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: kendall_uncertainty
  kwargs:
    freeze_log_vars: true

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16
  lr: 0.0005
  lr_lora: 0.00003
  lr_fusion: 0.00005
  num_workers: 4
  kwargs:
    accumulate_grad_batches: 2
    gradient_clip_val: 1.0

notes: |
  v3 capacity_min — v2 처방 + capacity 곱곱 축소 (trunk 128→64, fusion 768→256,
  dropout 0.5). v2 의 작은 task 우세 그대로 두고 큰 task 영향 검증.
