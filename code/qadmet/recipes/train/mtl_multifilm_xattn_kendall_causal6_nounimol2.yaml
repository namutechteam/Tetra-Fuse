name: mtl_multifilm_xattn_kendall_causal6_nounimol2
kind: train

# Symmetric multi-primary FiLM + cross-attention late fusion (3-modality, UniMol2 제외).
#
# 동기: 단일-primary `film` (CheMeleon main + 보조 concat → γ/β) 의 비대칭을 해소.
#   K=3 modality 를 각각 한 번씩 primary 로 두고 (self-anchor residual + 나머지로
#   FiLM 변조) branch 3개를 만든 뒤, modality-as-token cross-attention 으로 늦게 한 번
#   섞는다. ⚠ 완전 대칭 융합은 분자표현 문헌(MuMo arXiv:2510.23640 등)에서 modality
#   collapse 위험 → 본 recipe 는 self-residual + late fusion + identity-init + γ clamp
#   + condition/branch dropout 으로 "약한 대칭" 안전판을 둔다.
#
# 비교 베이스라인:
#   - 단일-primary FiLM(concat-aux) + Kendall: mtl_chemeleon_film_aux_kendall_lastlinear_causal6.
#   - GR-MF(per-group gate + cross-modal) 3-modality: mtl_4modality_grmf_causal6_robustaligned_nounimol2.
#   - robust_attention 3-modality: mtl_4modality_robust_causal6_nounimol2.
#
# UniMol2 제외 부수효과: OPM N² batch=16 ceiling 해제 (메모리 unimol2_4modality_batch_ceiling).
#   비교 공정성 위해 batch_size=16 유지하나, 단독 탐색 시 24~32 로 상향 가능.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # 6-group causal

features:
  graph: chemeleon
  descriptors: []
  embeddings: [molformer_tokens, graphmvp_data]   # UniMol2 제외 → 3-modality
  missing_policy: mask_token

model:
  type: multitask
  backbone:                                  # branch 0 primary
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_dropout: 0.0
  extra_backbones:                           # branch 1, 2 primary (도 각각 primary 가 됨)
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.2
    - type: graphmvp
      consumes: [graphmvp_data]
      kwargs:
        d_h: 300
        checkpoint_path: data/weights/graphmvp/graphmvp_hybrid.pth
        num_layer: 5
        emb_dim: 300
        JK: last
        adapter_dropout: 0.0
        pool: mean
  fusion:
    type: multi_film
    entropy_weight: 0.0                       # cross-attn weight 미노출 — entropy reg 미사용
    kwargs:
      output_dim: 300                         # 300 % cross_modal_heads(4) == 0
      cond_hidden: 256                         # 각 conditioner projection 차원
      condition_dropout: 0.2                   # robust/film recipe 정렬
      film_init_identity: true                 # γ≈1, β≈0 시작
      pre_norm: true                           # CheMeleon 2048 vs aux 768/300 scale 흡수
      gamma_min: 0.3                           # residual 과 함께면 x 계수 γ+1 ≥ 1.3
      gamma_max: 3.0                           #   → primary washout 차단 (film recipe 와 동일 철학)
      warmup_epochs: 1                          # 처음 1 epoch modulation freeze → mixer 가 raw primary 만 섞음
      cross_modal_layers: 1                     # mixer transformer layer (GR-MF 정렬)
      cross_modal_heads: 4
      cross_modal_ffn_mult: 4
      cross_modal_dropout: 0.1
      branch_dropout: 0.1                       # mixer 입력 branch token mask → branch collapse 방어
      use_output_proj: true                     # post-fusion Linear (300→300, identity-init)
  head:
    type: grouped                               # multi_film 은 (B, D) 출력 → grouped (not grouped_routed)
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty                 # Kendall UW
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 20
  patience: 5
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16                               # UniMol2 제외로 상향 가능하나 비교 위해 유지
  lr: 0.0005
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0                             # constant LR
  lr_lora: 0.00005
  lr_fusion: 0.0001                            # fusion(branch FiLM + mixer) 별도 lr
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  Symmetric multi-primary FiLM + cross-attention late fusion. UniMol2 제외 3-modality
  (CheMeleon / MoLFormer-LoRA / GraphMVP). 각 modality 가 한 번씩 primary 가 되어
  나머지로 FiLM 변조(병렬 평균) → self-anchor residual → branch 3개 →
  modality-as-token cross-attention(norm_first/gelu) → masked mean pool → output_proj.

  Fusion (multi_film):
    - branch i: x_i = primary_proj_i(norm(e_i)); conditioner j≠i 별 (γ_ij,β_ij);
      delta_i = mean_j(γ_ij⊙x_i + β_ij); z_i = x_i + delta_i.
    - γ clamp [0.3,3.0] + identity-init + warmup 1 epoch → 초기엔 modulation 무력.
    - mixer: TransformerEncoder(modality-as-token) → presence/branch-dropout 는
      key_padding_mask. masked mean pool → output_proj(identity-init).

  Loss/Optim: mixed_task_uncertainty(Kendall UW), lr=5e-4(constant)/lr_lora=5e-5/
    lr_fusion=1e-4.

  ⚠ 가중치: data/weights/chemeleon_mp.pt, data/weights/graphmvp/graphmvp_hybrid.pth,
     MoLFormer 84M ckpt (LoRA base).

  DDP (2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_multifilm_xattn_kendall_causal6_nounimol2.yaml \
      --devices 2 --strategy ddp --find-unused-parameters --no-ddp-static-graph
    - find-unused-parameters / no-ddp-static-graph: warmup(epoch 0→1) 이 film_gen/
      cond_proj 를 requires_grad False→True 로 전환 → trainable subset 변동 방어.
      (UniMol2 제외로 reducer.cpp 충돌은 없으나 warmup 토글 때문에 유지.)
