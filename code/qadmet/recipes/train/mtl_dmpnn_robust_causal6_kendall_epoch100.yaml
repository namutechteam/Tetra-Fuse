name: mtl_dmpnn_robust_causal6_kendall
kind: train

# DMPNN (from-scratch, no descriptor) + Kendall UW + causal6.
# Same options as mtl_chemeleon_robust_causal6_kendall.yaml — only backbone(DMPNN) differs (descriptor 0).
# dmpnn graph-only axis of the per-modality comparison set (ch/gm/um/mf). (current-option version of the old mtl_dmpnn_grouped)
#
# ★ scratch model exception: max_epochs 50 / patience 7 (no pretrain warm start → allow more room to converge).
# Otherwise (loss / head / dataset / precision / LR / batch) same as base.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # ← 6-group causal

features:
  graph: dmpnn
  descriptors: []                  # graph-only (lower-bound baseline for rdkit/xtb variants)
  embeddings: []
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include _base/model/dmpnn_default.yaml   # type: dmpnn (d_h=300, depth=3, scratch)
  extra_backbones: []
  fusion: null
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4                 # ← same as base

loss:
  type: mixed_task_uncertainty     # Kendall UW
  classification: bce_with_logits
  regression: masked_mae
  task_weighting: null             # ← same as base (not the kendall_uncertainty of mixed_kendall include)
  kwargs:
    freeze_log_vars: false

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100                   # as trained (run 63cabbaf3772); scratch model
  patience: 15                      # as trained (run 63cabbaf3772)
  precision: bf16-mixed
  early_stopping: true
  batch_size: 16                   # aligned with base axis (DMPNN is a free knob that can be increased)
  lr: 0.0005                       # constant LR
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1
    gradient_clip_val: 1.0

notes: |
  DMPNN(scratch, graph-only) + Kendall UW + causal6. Same options as mtl_chemeleon_robust_causal6_kendall,
  only backbone(DMPNN) differs, and there is no descriptor.
  (old mtl_dmpnn_grouped = current-option converted version of tdc_admet_22 / default trainer; original preserved)

  scratch exception: max_epochs 50 / patience 7 (no pretrain warm start).
  ⚠ chemeleon(pretrained) runs converge very quickly at const-LR 5e-4, with best epoch 2~4 →
    scratch DMPNN is also likely to terminate via early-stop within the 50 upper bound (watch for initial instability with warmup 0).
