name: mtl_dmpnn_molformer_lora_robust
kind: train

dataset: !include _base/dataset/tdc_admet_22.yaml

# molformer_tokens는 LoRA backbone의 토큰 입력으로 소비됨 — fusion modality에서 자동 제외.
features:
  graph: dmpnn
  descriptors: [rdkit2d, xtb]
  embeddings: [molformer_tokens]
  missing_policy: mask_token

model:
  type: multitask
  backbone: !include _base/model/dmpnn_default.yaml
  extra_backbones:
    - type: molformer_lora
      consumes: [molformer_tokens]
      kwargs:
        lora_rank: 16
        lora_alpha: 32
        lora_dropout: 0.1
  fusion: !include _base/fusion/robust_attention.yaml
  head:
    type: grouped
    routing: taskset_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.2

loss: !include _base/loss/mixed_kendall.yaml

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100
  patience: 20
  precision: 32-true
  early_stopping: true
  batch_size: 32
  lr: 0.001          # D-MPNN / fusion projections / GroupedHead
  lr_lora: 0.00005   # LoRA-MoLFormer query/value
  num_workers: 4

notes: |
  mtl_dmpnn_molformer_lora 의 RobustAttentionFusion 변형.
  AttentionFusion → RobustAttentionFusion (tau annealing, modality dropout, residual).

  Fusion 개선 (Step E):
  - tau annealing: 초기 2.0 → 0.5 (50 epoch 걸쳐).
  - modality dropout: 0.1 (training 중 modality 10% drop).
  - residual: weighted sum + mean(projected).
  - entropy_weight: 0.01 (alpha diversity 장려).

  데이터 경로는 mtl_dmpnn_molformer_lora 동일.
