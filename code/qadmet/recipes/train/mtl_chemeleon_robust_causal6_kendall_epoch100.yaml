name: mtl_chemeleon_robust_causal6_kendall
kind: train

# CheMeleon uni-backbone + Kendall UW (mixed_task_uncertainty) + causal6 (6-group).
#
# Starting from mtl_4modality_robust_causal6.yaml, as a "single chemeleon backbone"
# reduced baseline. Removes the following among core components of 4-modality:
#   - extra_backbones (MoLFormer-LoRA / UniMol2-LoRA / GraphMVP) → []
#   - fusion (robust_attention) → null  (single backbone → fusion unnecessary)
#   - embeddings [] (consume graph only)
# Accordingly, robust_causal6's lr_lora / lr_fusion / fusion warmup / modality_dropout /
# UniMol2 batch-16 OPM constraint is entirely obsolete → removed or demoted to a free knob.
#
# Retained from robust_causal6 (comment "← robust_causal6"):
#   - dataset = tdc_admet_22_causal6 (6-group causal)
#   - loss = mixed_task_uncertainty (Kendall UW), freeze_log_vars false
#   - trainer regime: 100ep / constant LR 5e-4 / bf16-mixed / patience 15 / batch 16 (as trained)
#   - head: grouped(taskset_grouping), trunk_hidden 128, dropout 0.4
# Added exclusively for uni-backbone (← uni):
#   - backbone.adapter_kind=paper (AAAI'24 AdapterGNN) — to the frozen backbone
#     grants training capacity. Unlike 4-modality, where fusion handled capacity,
#     for uni-backbone, adapter capacity directly determines performance.

dataset: !include _base/dataset/tdc_admet_22_causal6.yaml   # ← robust_causal6 (6-group causal)

features:
  graph: chemeleon
  descriptors: []
  embeddings: []                  # ← uni: auxiliary modality embeddings not consumed (graph only)
  missing_policy: mask_token

model:
  type: multitask
  backbone:
    type: chemeleon
    kwargs:
      d_h: 2048
      checkpoint_path: data/weights/chemeleon_mp.pt
      d_xd: 0
      adapter_kind: paper          # AAAI'24 paper-faithful AdapterGNN (backbone default,
                                   #   specified). pre/post block every depth-1=2 iter, γ init=0
                                   #   → output equivalent to frozen-only baseline initially.
      adapter_bottleneck: 256      # ← same as robust_causal6 chemeleon (backbone default 256).
                                   #   4modality unspecified = default 256 → same capacity maintained.
      adapter_dropout: 0.0
  extra_backbones: []             # ← uni: removed MoLFormer/UniMol2/GraphMVP
  fusion: null                    # ← uni: single backbone → robust_attention fusion removed
  head:
    type: grouped
    routing: taskset_grouping      # code gate — actual grouping is TaskSet.initial_grouping
    kwargs:
      trunk_hidden: 128
      dropout: 0.4

loss:
  type: mixed_task_uncertainty     # ← robust_causal6 (Kendall UW)
  classification: bce_with_logits
  regression: masked_mae           # sparse label masking required
  task_weighting: null             # Kendall σ dynamically weights via log-var → inverse-freq prior off
  kwargs:
    freeze_log_vars: false         # ← robust_causal6 (log-var training allowed)

trainer:
  seeds: [0, 1, 2, 3, 4]
  max_epochs: 100                   # as trained (run de323a791224)
  patience: 15                      # ← robust_causal6
  precision: bf16-mixed            # ← robust_causal6
  early_stopping: true
  batch_size: 16                   # ← mirrors robust_causal6. ⚠ UniMol2 OPM N² ceiling
                                   #   is absent for uni-backbone → effectively a free knob (can raise).
  lr: 0.0005                       # ← robust_causal6 (constant LR)
  init_lr: 0.0005
  final_lr: 0.0005
  warmup_epochs: 0                 # constant LR (Noam disabled — init=final=peak)
  # lr_lora / lr_fusion removed: uni-backbone has no LoRA·fusion parameters → single lr.
  num_workers: 4
  predict_ckpt: best
  kwargs:
    accumulate_grad_batches: 1     # effective batch 32 = DDP 2-rank × 16
    gradient_clip_val: 1.0

notes: |
  CheMeleon uni-backbone (AdapterGNN paper-faithful) + Kendall UW + causal6 6-group.
  baseline reducing mtl_4modality_robust_causal6.yaml to single-backbone —
  for measuring the "1 modality" lower bound against 4-modality robust_attention fusion / FiLM-aux.

  Backbone:
    - chemeleon_mp.pt frozen (BondMessagePassing + MeanAggregation).
    - adapter_kind="paper": every (depth-1)=2 iteration of chemprop depth=3
      pre/post AdapterGNNBlock pair (bond-level, d=2048, r=256). 4 adapters total.
      each block = down → ReLU → up → BN → γ·scale (parameter init=0) → dropout → delta.
      γ=0 initially gives output equivalent to frozen-only baseline → stable warm start.
    - trainable post-pool Linear backbone.proj.0 (CHEMELEON_HIDDEN → d_h=2048).

  Routing:
    - dataset = tdc_admet_22_causal6 (6-group causal chain).
    - groups (22 tasks total): oral_uptake(4) / distribution_cns(4) /
      interaction_liabilities(5) / metabolic_turnover(5) / distal_safety(3) /
      composite_exposure(1).
    - the head.routing string is merely a code path gate; the actual grouping
      comes from TaskSet.initial_grouping = ADMET_6_GROUP_CAUSAL.

  Loss / Optim:
    - mixed_task_uncertainty (Kendall UW): weights loss via per-task learnable log-variance
      (L = Σ exp(-s_k)·L_k + s_k). freeze_log_vars=false → log-var training allowed.
      single backward via autograd → manual opt unnecessary (accumulate/clip work normally).
    - lr=5e-4 constant single (no LoRA·fusion → lr separation unnecessary).

  comparison targets:
    - mtl_4modality_robust_causal6 (robust_attention 4-modality, same loss/causal6).
    - mtl_chemeleon_film_aux_kendall_lastlinear_causal6 (CheMeleon primary + FiLM aux).
    → all three share Kendall UW + causal6 identically, differing only in "modality/fusion configuration" ablation axis.

  ⚠ weights required: data/weights/chemeleon_mp.pt.

  example run (torchrun, 2-GPU):
    torchrun --nproc_per_node=2 -m qadmet.cli.main train \
      --recipe recipes/train/mtl_chemeleon_robust_causal6_kendall.yaml \
      --devices 2 --strategy ddp
    - unlike robust_causal6, there is no UniMol2 LoRA reducer / fusion warmup, so
      --no-ddp-static-graph / --find-unused-parameters unnecessary (AdapterGNN γ init=0
      parameters are also registered in the graph, so not "unused").
