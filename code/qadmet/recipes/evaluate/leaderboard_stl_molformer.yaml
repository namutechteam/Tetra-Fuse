name: leaderboard_stl_molformer
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: stl_molformer_lora
    target_kind: train
    target_run_id: ac26b38b99c4
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  STL MoLFormer-XL + LoRA (q/v rank=16) 런의 TDC leaderboard 랭킹 산출.
  leaderboard_summary.ipynb 가 자동 수집하도록 leaderboard.csv 를 생성한다.
  target = stl_molformer_lora / run=ac26b38b99c4 (05-18, bottleneck head, 22-task 완본).
  (옛 1674754ee094 는 linear head → bottleneck 계열로 통일하기 위해 ac26 채택.)
  산출물: data/metrics.csv (per-task), data/leaderboard.csv (rank/n_total + Top 점수).
