name: leaderboard_stl_graphmvp_seed01234
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: stl_graphmvp_adaptivegnn_paper
    target_kind: train
    target_run_id: 898dfd67a49b   # ← Paste the run_id output by train
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  Compute TDC leaderboard ranking for STL GraphMVP + AdapterGNN paper (seeds 0-4) run.
  Replace target_run_id with the run_id output by the stl_graphmvp_adaptivegnn_paper_seed01234.yaml train run.
  Output: data/metrics.csv (per-task), data/leaderboard.csv (rank/n_total + Top score).
