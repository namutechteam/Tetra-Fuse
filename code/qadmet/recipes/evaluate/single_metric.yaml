name: single_metric
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  compare_to: []          # 비교 대상 없음 — target 자체 metric 표만 출력
  kwargs:
    target: mtl_dmpnn_grouped   # store.latest 의 train artifact
    target_kind: train
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005

notes: |
  단일 신규 artifact 의 7-컬럼 metric 표만 만든다.
  산출물:
    - data/metrics.csv  : [dataset, metric, mean, std, ensemble_mean, ensemble_median, n_seeds, n_test]
    - data/comparison.csv / .md  : compare_to 가 비어 있으면 비교 행 없음 (헤더만).
  TDC 인터넷 / leaderboard 호출 없음.
