name: leaderboard_xattn_primary_chemeleon_kendall_causal6_nounimol2
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: mtl_xattn_primary_chemeleon_kendall_causal6_nounimol2
    target_kind: train
    # target_run_id 생략 → latest train run 사용
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  asymmetric primary(query)=chemeleon + cross-attention 주입 fusion 의 TDC leaderboard 랭킹.
  대상 train: mtl_xattn_primary_chemeleon_kendall_causal6_nounimol2 (latest, 5-seed).
  산출물: data/metrics.csv, data/leaderboard.csv (rank/n_total + Top).
