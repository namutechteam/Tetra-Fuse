name: leaderboard_pureswap_gradnorm
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: mtl_graphmvp_film_aux_gradnorm_lastlinear_causal6_pureswap
    target_kind: train
    target_run_id: 48c4f66451d1       # ckpt 교체 후 재생성한 predictions.parquet
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  pureswap (graphmvp primary + FiLM aux + GradNorm) 런의 TDC leaderboard 랭킹 산출.
  ckpt 교체 (best-v1.ckpt → best.ckpt for seed 0,1) + predict_from_ckpt.py 로 predictions.parquet
  재생성된 상태에서 실행할 것.
  산출물: data/metrics.csv (per-task), data/leaderboard.csv (rank/n_total + Top 점수)
