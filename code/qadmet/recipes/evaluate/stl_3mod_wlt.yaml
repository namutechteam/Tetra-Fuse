name: stl_3mod_wlt
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  compare_to:
    - stl_graphmvp_adaptivegnn
    - stl_molformer_lora
  kwargs:
    target: stl_chemeleon_adaptivegnn
    target_kind: train
    target_run_id: 784fd6916fcd          # chemeleon STL 1차 (30/5, 85% 수렴).
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    base_run_ids:
      stl_graphmvp_adaptivegnn: 54ea17568152   # graphmvp 재학습 (100/20).
      stl_molformer_lora: 1674754ee094         # molformer LoRA (30/5).

notes: |
  4-modality STL 중 3종 (chemeleon / graphmvp 재학습 / molformer LoRA) W/L/T 비교.
  unimol2_lora 는 학습 진행 중 → 추후 합류.

  target = chemeleon (4.2M adaptor, 1차 30/5 결과 — borderline 수렴 85%).
  compare:
    - graphmvp 재학습 (90K adaptor, 100/20 — 100% 학습 완주, 57% ep99 도달).
    - molformer LoRA (rank=16, 30/5 — 98% 수렴).

  산출물:
    - data/metrics.csv         : chemeleon STL 의 7-컬럼 metric 표.
    - data/comparison.csv/.md  : pairwise [chem vs graphmvp, chem vs molformer] 표.
    - manifest.metrics.wlt     : 비교 대상별 W/L/T/missing/net.

  pair coverage:
    - chemeleon ↔ graphmvp        ✓
    - chemeleon ↔ molformer       ✓
    - graphmvp ↔ molformer        ✗ (필요 시 별도 recipe 로 보강)
