name: leaderboard_stl_molformer_seed01234
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: stl_molformer_lora
    target_kind: train
    target_run_id: aa4e18e3c732   # ← train 출력 run_id 붙여넣기
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  STL MoLFormer-XL + LoRA (seeds 0-4) 런의 TDC leaderboard 랭킹 산출.
  target_run_id 는 stl_molformer_lora_seed01234.yaml train 실행이 출력한 run_id 로 교체.
  산출물: data/metrics.csv (per-task), data/leaderboard.csv (rank/n_total + Top 점수).
