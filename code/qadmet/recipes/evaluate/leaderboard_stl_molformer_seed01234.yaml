name: leaderboard_stl_molformer_seed01234
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: stl_molformer_lora
    target_kind: train
    target_run_id: aa4e18e3c732   # ← Paste the run_id output from train
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  Computes TDC leaderboard ranking for STL MoLFormer-XL + LoRA (seeds 0-4) run.
  Replace target_run_id with the run_id output by the stl_molformer_lora_seed01234.yaml train run.
  Output: data/metrics.csv (per-task), data/leaderboard.csv (rank/n_total + Top score).
