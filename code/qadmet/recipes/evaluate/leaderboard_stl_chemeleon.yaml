name: leaderboard_stl_chemeleon
kind: evaluate

evaluation:
  benchmark: tdc_admet
  aggregate: mean
  kwargs:
    target: stl_chemeleon_adaptivegnn_paper
    target_kind: train
    target_run_id: 641681c81003
    split: test
    task_set: tdc_admet_22
    column: ensemble_mean
    tie_eps: 0.005
    leaderboard:
      methods: [Top]
      use_cache: true

notes: |
  STL CheMeleon + AdapterGNN paper-faithful run's TDC leaderboard ranking computation.
  Generates leaderboard.csv so that leaderboard_summary.ipynb can automatically collect it.
  target = stl_chemeleon_adaptivegnn_paper / run=ce57c381dfeb (only run, 30/5, 22-task complete version).
  Output: data/metrics.csv (per-task), data/leaderboard.csv (rank/n_total + Top score).
