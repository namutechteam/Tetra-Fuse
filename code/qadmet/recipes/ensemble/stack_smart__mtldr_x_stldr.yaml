name: stack_smart__mtldr_x_stldr
kind: stack

ensemble:
  strategy: smart_fallback
  bases:
    - mtl_dmpnn_rdkit
    - stl_dmpnn_rdkit
  kwargs:
    fit_split: val
    split: test
    winner_threshold: 0.5
    fallback: average
    eps: 1.0e-12
    global_fit: false
    unfit_strategy: uniform

notes: |
  chemprop+RDKit MTL + chemprop+RDKit STL (rdkit-rich pair)
  task 별 winner-takes-all (val MSE dominance) + average fallback.
