name: stack_ivar__mtlchfilm_x_stlch
kind: stack

ensemble:
  strategy: inverse_variance
  bases:
    - mtl_chemeleon_film_aux
    - stl_chemeleon_adaptivegnn
  kwargs:
    fit_split: val
    split: test
    eps: 1.0e-6
    global_fit: false
    normalize_weights: true
    unfit_strategy: uniform

notes: |
  chemeleon FiLM+aux MTL + chemeleon AdaptiveGNN STL
  val 잔차 분산 역수 가중치 (task 별).
