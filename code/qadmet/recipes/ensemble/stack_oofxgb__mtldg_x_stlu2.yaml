name: stack_oofxgb__mtldg_x_stlu2
kind: stack

ensemble:
  strategy: oof_xgboost
  bases:
    - mtl_dmpnn_grouped
    - stl_unimol2_lora
  meta_model: xgboost
  kwargs:
    fit_split: val
    split: test
    task_set: tdc_admet_22
    meta_model_kwargs:
      n_estimators: 100
      max_depth: 4
      learning_rate: 0.1
      tree_method: hist
    unfit_strategy: uniform

notes: |
  chemprop MTL (7-group) + UniMol2 LoRA STL
  task 별 XGBoost meta-learner (val 잔차 위 학습). 옛 v4 동등.
