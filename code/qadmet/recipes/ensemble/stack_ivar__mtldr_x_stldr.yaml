name: stack_ivar__mtldr_x_stldr
kind: stack

ensemble:
  strategy: inverse_variance
  bases:
    - mtl_dmpnn_rdkit
    - stl_dmpnn_rdkit
  kwargs:
    fit_split: val
    split: test
    eps: 1.0e-6
    global_fit: false
    normalize_weights: true
    unfit_strategy: uniform

notes: |
  chemprop+RDKit MTL + chemprop+RDKit STL (rdkit-rich pair)
  val 잔차 분산 역수 가중치 (task 별). 옛 v2 단순화 버전.
