name: stack_inverse_variance
kind: stack

ensemble:
  strategy: inverse_variance
  bases:
    - mtl_dmpnn_grouped
    - stl_dmpnn_rdkit
  kwargs:
    fit_split: val          # base 의 val 예측에서 잔차 분산 추정 → per-task weight 학습
    split: test             # 학습된 weight 로 test 예측 결합 (기본값이지만 명시)
    eps: 1.0e-6             # 가중치 폭주 방지 (MSE=0 인 task 처리)
    global_fit: false       # task 별 가중치 (기본). true 면 전체 한 덩어리.
    normalize_weights: true # 가중치 합=1 정규화 (기본 권장)
    unfit_strategy: uniform # fit 단계에서 못 본 task 는 균등 평균 fallback
    # base_kind: train      # base artifact kind. 기본 train
    # base_run_ids: {...}   # 이름→run_id 명시 매핑

notes: |
  옛 phase3 v2 (run_stacking_v2_xgb.stack_inverse_var) 단순화 버전.
  옛 v2 는 leaderboard metric (auroc/mae) 자체로 가중치를 결정했으나, 여기서는
  base 의 val 잔차 분산 (MSE) 기반 — base 자체 예측만으로 self-contained.

  사용자 환경 prereq:
    - 두 base 의 train artifact 가 ``predictions.parquet`` 에 ``split="val"`` 행을
      포함해야 한다 (Step 4.2 에서 MTL runner 도 val 예측 작성하도록 확장).
    - 만약 옛 base artifact 라 val 행이 없으면, base 를 다시 학습하거나 ``fit_split``
      을 ``test`` 로 바꿔서 (정확도는 떨어지지만) 동작은 가능.
