name: stack_smart_fallback
kind: stack

ensemble:
  strategy: smart_fallback
  bases:
    - mtl_dmpnn_grouped
    - stl_dmpnn_rdkit
  kwargs:
    fit_split: val           # base 의 val 잔차로 task 별 winner / fallback 결정
    split: test              # 학습된 가중치로 test 예측 결합 (기본값이지만 명시)
    winner_threshold: 0.5    # best_mse / second_best_mse < 0.5 → winner-takes-all
                             #   (winner 의 MSE 가 runner-up 의 절반 이하일 때만 단독 채택)
    fallback: average        # winner 가 아닐 때: "average" | "inverse_variance"
    eps: 1.0e-12             # dominance 분모 보호 + inverse_variance fallback 안정화
    global_fit: false        # task 별 결정 (기본). true 면 전체 잔차로 단일 결정.
    unfit_strategy: uniform  # fit 단계에서 못 본 task 는 균등 평균 fallback

notes: |
  옛 phase4 v5 (run_stacking_v5_smart) 의 honest-holdout 재해석.
  옛 v5 의 "smart" 은 base 가용성 기반 (val/test size 불일치 시 base drop) 이었으나,
  신규 ``MetaDataset.from_predictionsets`` 의 ``(seed, task, smiles)`` inner-join 이
  자동 처리하므로, 신규 의도는 *task 별 base 강점* 기반 winner-takes-all + fallback.

  사용자 환경 prereq:
    - 두 base 의 train artifact 가 ``predictions.parquet`` 에 ``split="val"`` 행을
      포함해야 한다 (Step 4.2 부터 MTL runner, Step 4.4 부터 STL DMPNN 도 작성).
    - val 행이 없으면 ``fit_split=test`` 로 바꾸면 동작은 하지만 honest 보장 깨짐.

  튜닝 가이드:
    - ``winner_threshold`` 를 1.0 에 가깝게 올릴수록 winner-takes-all 빈도 증가.
      ablation 시 0.3 / 0.5 / 0.7 정도 sweep 추천.
    - ``fallback="inverse_variance"`` 는 winner 가 분명치 않은 task 에서도 기여도
      차이를 반영. 분류/회귀 모두 raw 잔차 MSE 기준 — base 가 분류를 prob 으로
      통일했다는 가정 (qadmet train runner 가 Step 4.2 부터 통일).
