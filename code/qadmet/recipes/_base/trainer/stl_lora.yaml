# Values as actually trained for the released STL LoRA run (stl_molformer,
# run aa4e18e3c732 - see artifacts/baselines/stl_molformer/baseline/manifest.yaml).
seeds: [0, 1, 2, 3, 4]   # TDC fold seeds; the runner passes these straight to load_fold
max_epochs: 100
patience: 15
precision: 32-true
early_stopping: true
batch_size: 32
lr: 0.001          # head / non-LoRA params
lr_lora: 0.00005   # LoRA 가중치 — 옛 run_stl_*_lora.py 와 동일
num_workers: 2
