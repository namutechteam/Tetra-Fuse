name: precompute_molformer_tokens
kind: precompute
features:
  embeddings:
    - molformer_tokens
notes: |
  TDC ADMET 22 union SMILES's MoLFormer-XL token_ids + attention_mask (each MAX_LEN=202).
  For eliminating per-batch tokenize cost during LoRA fine-tune. Output columns are
  tok_000..tok_201 + msk_000..msk_201 (all int32).
  Restructured the logic of scripts-old/precompute_molformer_tokens.py on top of PrecomputeBase.
  parity check: parity/check_precompute.py molformer_tokens
