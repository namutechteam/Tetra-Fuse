name: precompute_gfn_missing_vector
kind: precompute
features:
  descriptors:
    - gfn_missing_vector
notes: |
  GFN2-xTB 채널 4 종 (dipole/homo_lumo_gap/electrons/total_energy) 의 NaN 패턴을
  binary mask (4-dim) 로 노출. ``data/embeddings/xtb.parquet`` 가 먼저 사전 계산
  돼야 한다.

  Why:
    옛 phase1.3b 는 xtb 실패 분자를 zeros 로 채워 학습 — "왜 0 인지" 를 모델이 모름.
    본 mask 를 descriptor 로 함께 concat 하면 backbone 이 "이 분자의 xtb 정보는
    신뢰할 수 없다" 는 신호를 직접 받음.

  data path:
    Step B 디자인 — descriptors 는 chemprop X_d 로 직접 concat (DMPNN.fingerprint).
    train recipe ``mtl_dmpnn_rdkit_xtb_missing.yaml`` 가 본 builder 를 활용.
