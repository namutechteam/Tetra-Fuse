[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qadmet"
version = "0.1.0"
description = "QADMET — TDC ADMET multi-task learning research platform (recipe + registry + lineage)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tk_ahn" }]
# 의존성은 conda 환경(admet-mtl)에서 사전 설치된 것을 그대로 사용한다.
# 여기서는 패키지 빌드/설치만 가능하도록 메타데이터를 최소화한다.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.scripts]
qadmet = "qadmet.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qadmet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
