[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qadmet"
version = "0.1.0"
description = "QADMET — TDC ADMET multi-task learning research platform (recipe + registry + lineage)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "tk_ahn" }]
# Dependencies use the packages pre-installed in the conda environment (admet-mtl) as-is.
# Here, metadata is minimized to allow only package build/install.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.scripts]
qadmet = "qadmet.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qadmet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
